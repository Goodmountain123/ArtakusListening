<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listening Party · 트랙 에디터</title>
<style>
:root{--bg:#0f1014;--panel:#17181e;--line:#262833;--text:#e8e8ec;--mut:#8b8d98;--acc:#ff5a36;--ok:#3ecf8e;--bad:#ff4d6d;--warn:#f5b84a}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);height:53px}
header h1{font-size:14px;letter-spacing:.12em;margin:0}
header .tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.warnbar{background:#3a2a10;color:var(--warn);padding:8px 20px;font-size:13px}
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 53px)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.load{padding:14px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.load .row{display:flex;gap:6px}
input,select,textarea{background:#0c0d11;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a4d5c}
textarea{min-height:72px;resize:vertical}
button,.btn{background:#22242d;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{background:#2b2e39}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
#status{color:var(--mut);font-size:12px;min-height:18px}
#summary{padding:10px 14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
#summary b{color:var(--text)}
#list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#list a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:8px 14px;color:inherit;text-decoration:none;border-bottom:1px solid #1c1d24;align-items:center}
#list a:hover{background:#1b1c23}
#list a.on{background:#23252f}
.idx{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.ttl{overflow:hidden}
.ttl span.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.io{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
main{overflow:auto;padding:20px 24px}
.wrap{max-width:820px}
#playerBox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
#playerBox iframe{position:absolute;inset:0;width:100%;height:100%}
#cd{position:absolute;inset:0;display:grid;place-items:center;align-content:center;pointer-events:none;background:rgba(0,0,0,.45);color:#fff;text-align:center}
#cd b{display:block;font-size:110px;line-height:1;font-weight:800}
#cd b.hit{font-size:56px;color:var(--acc)}
#cd span{letter-spacing:.3em;font-size:13px;color:var(--acc)}
.th{display:flex;gap:14px;align-items:flex-start;margin-top:18px}
.th .num{font-size:28px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.2}
.th .thx{flex:1;min-width:0}
.th h2{margin:0;font-size:20px}
.sub{margin:2px 0 0;color:var(--mut);font-size:12px}
.sub a{color:var(--mut)}
.nav{display:flex;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;color:var(--mut);font-weight:600}
.tc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
.tc b{font-size:18px;font-variant-numeric:tabular-nums}
.tc .row{display:flex;gap:4px}
.tc input{width:100%;font-variant-numeric:tabular-nums}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.mark{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
#now{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;min-width:90px}
.hint{color:var(--mut);font-size:12px;margin:8px 0 0}
table.cues{width:100%;border-collapse:collapse;margin-top:10px}
.cues td,.cues th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.cues th{color:var(--mut);font-weight:500;font-size:11px}
.cues input.sm{width:84px;font-variant-numeric:tabular-nums}
.cues input.xs{width:64px}
.cues select{width:120px}
.cues .act{white-space:nowrap;text-align:right}
.empty{color:var(--mut);max-width:560px;line-height:1.8}
.empty b{color:var(--text)}
#scanWrap{position:fixed;right:16px;bottom:16px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;color:var(--mut);z-index:10}
#scanWrap iframe{display:block;border-radius:4px}
#scanLabel{margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){.layout{grid-template-columns:1fr;height:auto}aside{max-height:none}#list{max-height:50vh}.tc,.grid{grid-template-columns:1fr 1fr}main{padding:16px}}
</style>
</head>
<body>
<header><h1>THE LISTENING PARTY</h1><span class="tag">관리자</span>
  <span style="flex:1"></span>
  <span id="liveInfo" style="font-size:12px;color:var(--mut)"></span>
  <input id="tokenInput" type="password" placeholder="관리자 토큰" style="width:160px">
  <button id="resetBtn" title="공개된 곡을 모두 지우고 처음 상태로">행사 초기화</button>
  <a class="btn" href="/" target="_blank" style="text-decoration:none">참가자 화면 ↗</a>
</header>
<div class="warnbar" id="warn" hidden>file:// 로 열면 YouTube가 재생을 거부합니다(오류 153). 로컬 서버로 여세요 — 예: 이 파일이 있는 폴더에서 <code>npx serve</code></div>
<div class="layout">
  <aside>
    <div class="load">
      <input id="plInput" placeholder="YouTube 재생목록 URL 또는 ID">
      <input id="keyInput" type="password" placeholder="YouTube Data API 키 (선택)">
      <div class="row"><button class="primary" id="loadBtn" style="flex:1">불러오기</button><button id="scanBtn">임베드 검증</button></div>
      <div id="status"></div>
    </div>
    <div id="summary"></div>
    <ol id="list"></ol>
    <div class="io">
      <button id="exportBtn">JSON 내보내기</button>
      <label class="btn" style="margin:0;font-size:13px;color:var(--text)">JSON 가져오기<input type="file" id="importInput" accept=".json" hidden></label>
      <button id="csvBtn">타임코드 CSV</button>
    </div>
  </aside>
  <main>
    <div class="wrap">
      <div id="playerBox" hidden><div id="player"></div><div id="cd" hidden></div></div>
      <div id="trackBody"></div>
    </div>
  </main>
</div>
<div id="scanWrap" hidden><div id="scanner"></div><div id="scanLabel">스캔 준비 중…</div></div>

<script>
const TYPES=['DROP','SING','SHOUT','MOVE','HIGHLIGHT'];
const SESSIONS=['','01 세로토닌 & 옥시토신','02 미드나잇 드라이브','03 움직여!','04 론리 시티 서울','05 축제의 시간'];
const F=[['title','제목'],['artist','아티스트'],['album','앨범'],['year','발매연도'],['session','세션','sel'],['tension','텐션 (1–10)','num'],['reason','선정 이유','area'],['points','감상 포인트','area'],['notes','곡 해설','area'],['related','관련곡 (한 줄에 하나)','area']];
const LS='lp_proto_v1';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=m=>{$('#status').textContent=m;};

/* ---------- 상태 ---------- */
let state={playlistId:'',tracks:[]};
try{const s=localStorage.getItem(LS);if(s)state=JSON.parse(s);}catch(e){}
function persist(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(persist,250);renderList();}

/* ---------- 시간 유틸 ---------- */
function fmt(s){if(s==null||isNaN(s))return '--:--';s=Math.max(0,+s);const m=Math.floor(s/60),r=s-m*60;return m+':'+r.toFixed(1).padStart(4,'0');}
function fmtD(s){if(!s)return '--:--';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0');}
function parseTC(v){v=String(v).trim();if(!v)return null;const p=v.split(':').map(Number);if(p.some(isNaN))return null;return p.reduce((a,b)=>a*60+b,0);}
function isoDur(d){const m=d.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/)||[];return (+(m[1]||0))*86400+(+(m[2]||0))*3600+(+(m[3]||0))*60+(+(m[4]||0));}
function runtime(t){const end=t.end??t.duration;return end?Math.max(0,end-(t.start||0)):null;}
function parsePl(v){v=v.trim();try{const u=new URL(v);return u.searchParams.get('list')||'';}catch(e){return v;}}
function errMsg(c){return({2:'잘못된 영상 ID',5:'HTML5 재생 오류',100:'삭제/비공개 영상',101:'임베드 차단',150:'임베드 차단',153:'리퍼러 없음 — file://로 열었음'})[c]||('오류 '+c);}

/* ---------- 트랙 병합 ---------- */
function blank(id){return{id,ytTitle:'',ytChannel:'',duration:null,durSrc:'',embed:'unknown',err:'',title:'',artist:'',album:'',year:'',session:'',tension:'',reason:'',points:'',notes:'',related:'',start:0,end:null,cues:[]};}
function clean(o){Object.keys(o).forEach(k=>{if(o[k]===undefined||(o[k]===''&&k!=='err'))delete o[k];});return o;}
function prefill(t){
  if(t.title||t.artist||!t.ytTitle)return;
  const s=t.ytTitle.replace(/\s*[\(\[【][^\)\]】]*[\)\]】]\s*/g,' ').trim();
  const i=s.indexOf(' - ');
  if(i>0){t.artist=s.slice(0,i).trim();t.title=s.slice(i+3).trim();}
  else{t.title=s;t.artist=t.ytChannel||'';}
}
function mergeTracks(items){
  const old=new Map(state.tracks.map(t=>[t.id,t]));
  state.tracks=items.map(it=>{const t=Object.assign(old.get(it.id)||blank(it.id),clean({...it}));prefill(t);return t;});
}

/* ---------- YouTube API ---------- */
let ytReady=false;const ytQ=[];
window.onYouTubeIframeAPIReady=()=>{ytReady=true;ytQ.splice(0).forEach(f=>f());};
const whenYT=()=>new Promise(r=>ytReady?r():ytQ.push(r));

/* Data API (키가 있을 때) */
async function loadViaAPI(pl,key){
  const ids=[];let tok='';
  do{
    const r=await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${encodeURIComponent(pl)}&key=${encodeURIComponent(key)}${tok?'&pageToken='+tok:''}`);
    const j=await r.json();if(j.error)throw new Error(j.error.message);
    j.items.forEach(i=>ids.push(i.contentDetails.videoId));tok=j.nextPageToken||'';
  }while(tok);
  const info={};
  for(let i=0;i<ids.length;i+=50){
    const r=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet,status&id=${ids.slice(i,i+50).join(',')}&key=${encodeURIComponent(key)}`);
    const j=await r.json();if(j.error)throw new Error(j.error.message);
    j.items.forEach(v=>info[v.id]=v);
  }
  return ids.map(id=>{
    const v=info[id];if(!v)return{id,embed:'no',err:'삭제/비공개 영상'};
    const rr=v.contentDetails.regionRestriction;
    const kr=rr&&((rr.blocked||[]).includes('KR')||(rr.allowed&&!rr.allowed.includes('KR')));
    return{id,ytTitle:v.snippet.title,ytChannel:v.snippet.channelTitle.replace(/ - Topic$/,''),duration:isoDur(v.contentDetails.duration),durSrc:'api',
      embed:(!v.status.embeddable||kr)?'no':'unknown',err:!v.status.embeddable?'임베드 차단':kr?'KR 지역 제한':''};
  });
}

/* 스캐너: 숨은 플레이어로 실제 재생해서 길이·제목·임베드 여부 확인 */
let scanner=null,scanEvt=null,scanning=false,stopFlag=false;
function getScanner(){
  return whenYT().then(()=>scanner?scanner:new Promise(res=>{
    const p=new YT.Player('scanner',{width:224,height:126,playerVars:{mute:1,playsinline:1,controls:0,rel:0},
      events:{onReady:()=>{scanner=p;res(p);},onStateChange:e=>scanEvt&&scanEvt('state',e.data),onError:e=>scanEvt&&scanEvt('error',e.data)}});
  }));
}
function waitEvt(test,ms){return new Promise(res=>{const to=setTimeout(()=>{scanEvt=null;res({timeout:true});},ms);scanEvt=(k,d)=>{const r=test(k,d);if(r){clearTimeout(to);scanEvt=null;res(r);}};});}
async function idsFromPlaylist(pl){
  const p=await getScanner();let err=null;
  scanEvt=(k,d)=>{if(k==='error')err=d;};
  p.cuePlaylist({list:pl,listType:'playlist'});
  for(let i=0;i<50;i++){
    await sleep(300);
    const l=p.getPlaylist&&p.getPlaylist();
    if(l&&l.length){scanEvt=null;return l;}
    if(err!=null&&i>10){scanEvt=null;throw new Error(errMsg(err));}
  }
  scanEvt=null;throw new Error('재생목록을 읽지 못함 — 비공개 목록이거나 ID가 틀렸을 수 있음');
}
async function scanOne(id){
  const p=await getScanner();
  const w=waitEvt((k,d)=>k==='state'&&d===1?{play:1}:k==='error'?{err:d}:null,15000);
  p.mute();p.loadVideoById(id);
  const r=await w;
  if(r.play){
    let d=0;for(let i=0;i<20;i++){d=p.getDuration();if(d)break;await sleep(150);}
    const vd=p.getVideoData?p.getVideoData():{};p.pauseVideo();
    return{duration:d||undefined,durSrc:'scan',ytTitle:vd.title,ytChannel:(vd.author||'').replace(/ - Topic$/,''),embed:'ok',err:''};
  }
  if(r.timeout){try{p.stopVideo();}catch(e){}return{embed:'unknown',err:'응답 없음(광고·버퍼링·자동재생 차단?)'};}
  return{embed:'no',err:errMsg(r.err)};
}
async function scanAll(){
  if(scanning){stopFlag=true;return;}
  scanning=true;stopFlag=false;$('#scanWrap').hidden=false;$('#scanBtn').textContent='검증 중지';
  const n=state.tracks.length;
  for(let i=0;i<n&&!stopFlag;i++){
    const t=state.tracks[i];
    $('#scanLabel').textContent=`${i+1}/${n} ${t.title||t.ytTitle||t.id}`;status(`임베드 검증 중 ${i+1}/${n}`);
    const r=await scanOne(t.id);
    if(t.durSrc==='api'&&t.duration){delete r.duration;delete r.durSrc;}
    Object.assign(t,clean(r));prefill(t);save();
  }
  try{scanner.stopVideo();}catch(e){}
  $('#scanWrap').hidden=true;$('#scanBtn').textContent='임베드 검증';scanning=false;
  const bad=state.tracks.filter(t=>t.embed==='no').length,unk=state.tracks.filter(t=>t.embed==='unknown').length;
  status(`검증 ${stopFlag?'중지':'완료'} — 재생 불가 ${bad}곡, 미확인 ${unk}곡`);
  renderTrack();
}

async function load(){
  const pl=parsePl($('#plInput').value),key=$('#keyInput').value.trim();
  if(!pl)return status('재생목록 URL 또는 ID를 넣으세요');
  try{localStorage.setItem(LS+'_key',key);}catch(e){}
  state.playlistId=pl;$('#loadBtn').disabled=true;
  try{
    if(key){
      status('Data API로 불러오는 중…');
      const items=await loadViaAPI(pl,key);mergeTracks(items);save();
      status(`${items.length}곡 불러옴 · 실제 재생 가능 여부는 '임베드 검증'으로 확인`);
      $('#loadBtn').disabled=false;
    }else{
      $('#scanWrap').hidden=false;status('재생목록 읽는 중…');
      const ids=await idsFromPlaylist(pl);mergeTracks(ids.map(id=>({id})));save();
      $('#loadBtn').disabled=false;
      await scanAll();
    }
  }catch(e){status('오류: '+e.message);$('#scanWrap').hidden=true;}
  $('#loadBtn').disabled=false;route();
}

/* ---------- 메인 플레이어 ---------- */
let player=null,playerId=null;
const live=()=>player&&player!=='pending';
const ptime=()=>live()&&player.getCurrentTime?player.getCurrentTime():null;
async function showPlayer(id){
  await whenYT();
  if(!player){
    player='pending';
    await new Promise(res=>{const p=new YT.Player('player',{width:'100%',height:'100%',videoId:id,playerVars:{playsinline:1,rel:0},
      events:{onReady:()=>{player=p;playerId=id;const c=cur();if(c&&c!==id){p.cueVideoById(c);playerId=c;}res();},onError:e=>status('플레이어: '+errMsg(e.data))}});});
    return;
  }
  if(live()&&playerId!==id){player.cueVideoById(id);playerId=id;}
}

/* ---------- 렌더 ---------- */
const cur=()=>(location.hash.match(/#t=([\w-]+)/)||[])[1]||null;
const trackOf=id=>state.tracks.find(t=>t.id===id);
const dotColor=t=>t.embed==='ok'?'var(--ok)':t.embed==='no'?'var(--bad)':'var(--mut)';
const embedLabel=t=>t.embed==='ok'?'임베드 재생 가능':t.embed==='no'?esc(t.err):'미검증'+(t.err?' · '+esc(t.err):'');

function renderList(){
  const c=cur();
  $('#list').innerHTML=state.tracks.map((t,i)=>`<li><a href="#t=${t.id}" class="${t.id===c?'on':''}"><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="ttl"><span class="t"><span class="dot" style="background:${dotColor(t)}"></span>${esc(t.title||t.ytTitle||t.id)}</span><small>${esc(t.artist||t.ytChannel||'')}${t.session?' · S'+esc(t.session.slice(0,2)):''}${t.cues.length?' · 큐 '+t.cues.length:''}</small></span><span class="dur">${fmtD(runtime(t))}</span></a></li>`).join('');
  if(!state.tracks.length){$('#summary').textContent='재생목록을 불러오세요.';return;}
  const total=state.tracks.reduce((a,t)=>a+(runtime(t)||0),0);
  const bad=state.tracks.filter(t=>t.embed==='no').length,miss=state.tracks.filter(t=>!t.duration).length;
  const per=SESSIONS.slice(1).map(s=>{const ts=state.tracks.filter(t=>t.session===s);return ts.length?`S${s.slice(0,2)} ${ts.length}곡 ${fmtD(ts.reduce((a,t)=>a+(runtime(t)||0),0))}`:'';}).filter(Boolean);
  $('#summary').innerHTML=`${state.tracks.length}곡 · 총 <b>${fmtD(total)}</b>${miss?` · 길이 미확인 ${miss}`:''}${bad?` · <span style="color:var(--bad)">재생 불가 ${bad}</span>`:''}${per.length?'<br>'+per.join(' · '):''}`;
}

function field([k,l,ty],t){
  let inp;
  if(ty==='sel')inp=`<select data-k="${k}">${SESSIONS.map(s=>`<option value="${esc(s)}" ${s===t[k]?'selected':''}>${s||'미배정'}</option>`).join('')}</select>`;
  else if(ty==='area')inp=`<textarea data-k="${k}">${esc(t[k])}</textarea>`;
  else inp=`<input data-k="${k}" ${ty==='num'?'type="number" min="1" max="10"':''} value="${esc(t[k])}">`;
  return `<div class="${ty==='area'?'full':''}"><label>${l}</label>${inp}</div>`;
}

function renderTrack(){
  const id=cur(),t=id&&trackOf(id);
  $('#playerBox').hidden=!t;
  if(!t){
    $('#trackBody').innerHTML=`<div class="empty"><p><b>1.</b> 왼쪽에 YouTube 재생목록 URL을 넣고 불러오기.<br>
      <b>2.</b> 키가 없으면 숨은 플레이어가 곡마다 실제로 재생해보며 길이·제목·임베드 가능 여부를 수집합니다(곡당 1~3초).<br>
      Data API 키를 넣으면 길이·제목을 즉시 가져오고, 임베드 실검증은 따로 돌립니다.<br>
      <b>3.</b> 트랙을 눌러 곡 정보를 쓰고, 재생하면서 음악 시작·끝과 큐포인트를 찍습니다.<br>
      모든 내용은 이 브라우저에 자동 저장됩니다. 백업은 JSON 내보내기로.</p></div>`;
    return;
  }
  showPlayer(id);
  const i=state.tracks.indexOf(t);
  $('#trackBody').innerHTML=`
  <div class="th"><span class="num">${String(i+1).padStart(2,'0')}</span>
    <div class="thx"><h2 id="hTitle">${esc(t.title||t.ytTitle||t.id)}</h2>
      <p class="sub"><span class="dot" style="background:${dotColor(t)}"></span>${embedLabel(t)} · <a href="https://youtu.be/${t.id}" target="_blank" rel="noopener">${esc(t.ytTitle||t.id)}</a></p></div>
    <div class="nav"><button class="primary" data-pub>참가자에게 공개</button><button data-go="-1" ${i?'':'disabled'}>←</button><button data-go="1" ${i<state.tracks.length-1?'':'disabled'}>→</button></div></div>
  <section class="card"><h3>타임코드</h3>
    <div class="tc">
      <div><label>영상 길이</label><b>${fmtD(t.duration)}</b></div>
      <div><label>음악 시작</label><div class="row"><input data-tc="start" value="${fmt(t.start||0)}"><button data-set="start" title="현재 재생 위치로">⌖</button></div></div>
      <div><label>음악 끝</label><div class="row"><input data-tc="end" value="${t.end!=null?fmt(t.end):''}" placeholder="${fmtD(t.duration)}"><button data-set="end" title="현재 재생 위치로">⌖</button></div></div>
      <div><label>실제 러닝타임</label><b id="rt">${fmtD(runtime(t))}</b></div>
    </div>
    <div class="mark"><span id="now">0:00.0</span>${TYPES.map(y=>`<button data-cue="${y}">+ ${y}</button>`).join('')}</div>
    <p class="hint">재생 중 버튼을 누르면 그 시점이 큐포인트로 찍힙니다. 단축키 M = HIGHLIGHT, Space = 재생/정지. ▶는 카운트다운 2초 전부터 재생.</p>
    <table class="cues"><thead><tr><th>시점</th><th>리드(초)</th><th>종류</th><th>메시지</th><th></th></tr></thead><tbody id="cueRows"></tbody></table>
  </section>
  <section class="card"><h3>곡 정보</h3><div class="grid">${F.map(f=>field(f,t)).join('')}</div></section>`;
  renderCues(t);
}

function renderCues(t){
  const tb=$('#cueRows');if(!tb)return;
  tb.innerHTML=t.cues.length?t.cues.map((c,j)=>`<tr data-j="${j}">
    <td><input class="sm" data-c="t" value="${fmt(c.t)}"></td>
    <td><input class="xs" type="number" min="0" step="0.5" data-c="lead" value="${c.lead}"></td>
    <td><select data-c="type">${TYPES.map(y=>`<option ${y===c.type?'selected':''}>${y}</option>`).join('')}</select></td>
    <td><input data-c="msg" value="${esc(c.msg)}" placeholder="화면 문구"></td>
    <td class="act"><button data-cplay>▶</button> <button data-cdel>✕</button></td></tr>`).join('')
    :`<tr><td colspan="5" class="hint">아직 큐포인트 없음</td></tr>`;
}
const sortCues=t=>t.cues.sort((a,b)=>a.t-b.t);
function addCue(t,type){
  const now=ptime();if(now==null)return status('플레이어가 준비되지 않음');
  t.cues.push({t:+now.toFixed(2),lead:5,type,msg:''});sortCues(t);renderCues(t);save();
}

/* ---------- 이벤트 ---------- */
const body=$('#trackBody');
body.addEventListener('input',e=>{
  const t=trackOf(cur());if(!t)return;
  const k=e.target.dataset.k;
  if(k){t[k]=e.target.value;if(k==='title')$('#hTitle').textContent=t.title||t.ytTitle||t.id;save();}
  const ck=e.target.dataset.c;
  if(ck==='msg'||ck==='lead'){const c=t.cues[+e.target.closest('tr').dataset.j];c[ck]=ck==='lead'?(+e.target.value||0):e.target.value;save();}
});
body.addEventListener('change',e=>{
  const t=trackOf(cur());if(!t)return;
  const tc=e.target.dataset.tc;
  if(tc){const v=parseTC(e.target.value);t[tc]=tc==='end'?v:(v||0);e.target.value=t[tc]!=null?fmt(t[tc]):'';$('#rt').textContent=fmtD(runtime(t));save();}
  const ck=e.target.dataset.c;
  if(ck==='t'){const v=parseTC(e.target.value),c=t.cues[+e.target.closest('tr').dataset.j];if(v!=null)c.t=v;sortCues(t);renderCues(t);save();}
  if(ck==='type'){t.cues[+e.target.closest('tr').dataset.j].type=e.target.value;save();}
});
body.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const t=trackOf(cur());if(!t)return;
  if('pub' in b.dataset){publish(t);return;}
  if(b.dataset.go){const n=state.tracks[state.tracks.indexOf(t)+(+b.dataset.go)];if(n)location.hash='t='+n.id;return;}
  if(b.dataset.set){const now=ptime();if(now==null)return;t[b.dataset.set]=+now.toFixed(1);body.querySelector(`[data-tc="${b.dataset.set}"]`).value=fmt(t[b.dataset.set]);$('#rt').textContent=fmtD(runtime(t));save();return;}
  if(b.dataset.cue){addCue(t,b.dataset.cue);return;}
  const tr=b.closest('tr');if(!tr)return;
  if('cplay' in b.dataset&&live()){const c=t.cues[+tr.dataset.j];player.seekTo(Math.max(0,c.t-c.lead-2),true);player.playVideo();}
  if('cdel' in b.dataset){t.cues.splice(+tr.dataset.j,1);renderCues(t);save();}
});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const t=trackOf(cur());if(!t||!live())return;
  if(e.code==='KeyM'){addCue(t,'HIGHLIGHT');e.preventDefault();}
  if(e.code==='Space'){player.getPlayerState()===1?player.pauseVideo():player.playVideo();e.preventDefault();}
});

/* 재생 시각 + 카운트다운 미리보기 */
setInterval(()=>{
  const now=ptime(),el=$('#now'),cd=$('#cd');
  if(el&&now!=null)el.textContent=fmt(now);
  const t=trackOf(cur());
  if(!t||now==null||playerId!==t.id){cd.hidden=true;return;}
  const c=t.cues.find(c=>now>=c.t-c.lead&&now<c.t+1);
  if(c){cd.hidden=false;cd.innerHTML=now<c.t?`<div><b>${Math.ceil(c.t-now)}</b><span>${esc(c.type)}</span></div>`:`<b class="hit">${esc(c.msg||c.type)}</b>`;}
  else cd.hidden=true;
},100);

/* 내보내기 / 가져오기 */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('#exportBtn').onclick=()=>download('listening-party-tracks.json',JSON.stringify(state,null,2),'application/json');
$('#importInput').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const s=JSON.parse(await f.text());if(!Array.isArray(s.tracks))throw 0;state=s;persist();route();status('가져오기 완료');}
  catch(err){status('JSON 형식이 맞지 않음');}
  e.target.value='';
};
$('#csvBtn').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['#','id','세션','아티스트','제목','영상길이','음악시작','음악끝','러닝타임','큐시점','리드','종류','메시지'].map(q).join(',')];
  state.tracks.forEach((t,i)=>{
    const base=[i+1,t.id,t.session,t.artist,t.title||t.ytTitle,fmtD(t.duration),fmt(t.start||0),t.end!=null?fmt(t.end):'',fmtD(runtime(t))];
    (t.cues.length?t.cues:[null]).forEach(c=>rows.push([...base,...(c?[fmt(c.t),c.lead,c.type,c.msg]:['','','',''])].map(q).join(',')));
  });
  download('listening-party-timecodes.csv','\ufeff'+rows.join('\n'),'text/csv');
};

/* ---------- 서버 연동 (참가자 앱) ---------- */
const token=()=>$('#tokenInput').value.trim();
async function api(path,method,data){
  if(location.protocol==='file:')throw new Error('서버에 배포된 주소에서만 동작합니다');
  const r=await fetch(path,{method,headers:{'content-type':'application/json','x-admin-token':token()},body:data?JSON.stringify(data):undefined});
  if(!r.ok)throw new Error(r.status===401?'관리자 토큰이 틀렸습니다':await r.text());
  return r.json();
}
async function publish(t){
  try{
    const r=await api('/api/now','POST',{...t,index:state.tracks.indexOf(t)+1});
    status(`"${t.title||t.ytTitle}" 공개됨 · 접속 중 ${r.listeners}명`);refreshLive();
  }catch(e){status('공개 실패: '+e.message);}
}
async function refreshLive(){
  if(location.protocol==='file:')return;
  try{const s=await (await fetch('/api/state')).json();$('#liveInfo').textContent=`공개 ${s.unlocked.length}곡 · 접속 ${s.listeners}명${s.now?' · 지금: '+s.now.title:''}`;}catch(e){}
}
$('#resetBtn').onclick=async()=>{
  if(!confirm('공개된 곡 목록을 모두 지웁니다. 계속할까요?'))return;
  try{await api('/api/reset','POST');status('행사 초기화 완료');refreshLive();}catch(e){status('초기화 실패: '+e.message);}
};
try{$('#tokenInput').value=localStorage.getItem(LS+'_admin')||'';}catch(e){}
$('#tokenInput').oninput=()=>{try{localStorage.setItem(LS+'_admin',token());}catch(e){}};
refreshLive();setInterval(refreshLive,10000);

/* ---------- 시작 ---------- */
function route(){renderList();renderTrack();}
window.addEventListener('hashchange',route);
try{$('#keyInput').value=localStorage.getItem(LS+'_key')||'';}catch(e){}
if(state.playlistId)$('#plInput').value=state.playlistId;
if(location.protocol==='file:')$('#warn').hidden=false;
$('#loadBtn').onclick=load;
$('#scanBtn').onclick=()=>state.tracks.length?scanAll():status('먼저 재생목록을 불러오세요');
route();
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
</script>
</body>
</html>
