<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listening Party · 관리자</title>
<style>
:root{--bg:#0f1014;--panel:#17181e;--line:#262833;--text:#e8e8ec;--mut:#8b8d98;--acc:#ff5a36;--ok:#3ecf8e;--bad:#ff4d6d;--warn:#f5b84a}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);height:53px}
header h1{font-size:13px;letter-spacing:.12em;margin:0;white-space:nowrap}
.mut{color:var(--mut)}
#saveInfo{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#liveInfo{font-size:12px;color:var(--mut);white-space:nowrap}
.warnbar{background:#3a2a10;color:var(--warn);padding:8px 20px;font-size:13px}
.layout{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 53px)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
input,select,textarea{background:#0c0d11;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a4d5c}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
textarea{min-height:72px;resize:vertical}
button,.btn{background:#22242d;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-block}
button:hover,.btn:hover{background:#2b2e39}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.row{display:flex;gap:6px;align-items:center}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:11px;color:var(--mut)}
.tabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--acc)}
.pane{display:flex;flex-direction:column;min-height:0;flex:1}
.load{padding:12px 14px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.toolbar{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);align-items:center}
.toolbar select{flex:1;min-width:0}
.tog{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);margin:0;white-space:nowrap;cursor:pointer}
.summary{padding:8px 14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.summary b{color:var(--text)}
.scroll{overflow:auto;flex:1;min-height:0}
#status{padding:8px 14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;min-height:34px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.dur,.idx{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
/* 전체 곡 */
.lib{list-style:none;margin:0;padding:0}
.lib li{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:6px 14px;border-bottom:1px solid #1c1d24}
.lib li.on{background:#23252f}
.lib a{color:inherit;text-decoration:none;min-width:0}
.stag{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 행사 순서 */
.sess{border-bottom:1px solid var(--line)}
.sh{display:flex;gap:4px;align-items:center;padding:8px 10px 4px 14px;background:#131419}
.sh .snum{color:var(--acc);font-weight:700;font-size:12px}
.sh input{border:0;background:transparent;font-weight:600;padding:3px 4px}
.sh input:focus{background:#0c0d11}
.sh .stime{font-size:11px;color:var(--mut);white-space:nowrap}
.sh button{padding:2px 7px;font-size:11px}
.sdesc{padding:0 10px 8px 14px;background:#131419}
.sdesc textarea{min-height:34px;font-size:12px;padding:5px 8px;background:#0f1014}
.sl{list-style:none;margin:0;padding:0;min-height:34px}
.sl:empty::after{content:'여기로 끌어오거나, 전체 곡 탭에서 체크해 넣으세요';display:block;padding:9px 14px;color:var(--mut);font-size:12px}
.sl li{display:grid;grid-template-columns:14px 22px 1fr auto 20px;gap:6px;align-items:center;padding:6px 8px 6px 8px;border-top:1px solid #1c1d24;background:var(--bg)}
.sl li.on{background:#23252f}
.sl li.playing .idx{color:var(--acc)}
.sl a{color:inherit;text-decoration:none;min-width:0}
.handle{cursor:grab;color:#5a5c68;text-align:center;font-size:12px;user-select:none}
.out{padding:0;border:0;background:transparent;color:#5a5c68;font-size:12px}
.out:hover{background:transparent;color:var(--bad)}
.sortable-ghost{opacity:.35}
.sortable-chosen{background:#23252f}
/* 메인 */
main{overflow:auto;padding:18px 24px 40px}
.wrap{max-width:860px}
.th{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.th .num{font-size:28px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.2;min-width:40px}
.th .thx{flex:1;min-width:0}
.th h2{margin:0;font-size:20px}
.sub{margin:2px 0 0;color:var(--mut);font-size:12px}
.sub a{color:var(--mut)}
#playerBox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
#playerBox iframe{position:absolute;inset:0;width:100%;height:100%}
#cd{position:absolute;inset:0;display:grid;place-items:center;align-content:center;pointer-events:none;background:rgba(0,0,0,.45);color:#fff;text-align:center}
#cd b{display:block;font-size:110px;line-height:1;font-weight:800}
#cd b.hit{font-size:56px;color:var(--acc)}
#cd span{letter-spacing:.3em;font-size:13px;color:var(--acc)}
.transport{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.transport #now{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;margin-left:6px}
#elsewhere{width:100%;background:#2a2110;color:var(--warn);border-radius:6px;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
#elsewhere button{font-size:12px;padding:3px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;color:var(--mut);font-weight:600}
.card h3 em{font-style:normal;letter-spacing:0;font-weight:400;margin-left:8px;color:#6b6d78}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.thumbrow{display:flex;gap:14px;align-items:center}
.thumb{width:112px;height:112px;border-radius:8px;background:#0c0d11 center/cover;border:1px dashed #3a3d4a;flex:none;display:grid;place-items:center;color:var(--mut);font-size:11px;text-align:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.drag{border-color:var(--acc);border-style:solid}
.thumb .yt{position:absolute;bottom:4px;left:4px;right:4px;font-size:10px;background:rgba(0,0,0,.7);border-radius:4px;padding:1px 4px}
.tc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;margin-top:14px}
.tc b{font-size:17px;font-variant-numeric:tabular-nums}
.tc .row{gap:4px}
.tc input{font-variant-numeric:tabular-nums}
/* 타임라인 */
.tl{position:relative;user-select:none;-webkit-user-select:none}
.ruler{position:relative;height:24px;cursor:pointer;background:#121318;border-radius:6px 6px 0 0}
.ruler span{position:absolute;top:3px;font-size:10px;color:var(--mut);transform:translateX(-50%);pointer-events:none}
.ruler span::after{content:'';position:absolute;left:50%;top:15px;height:6px;border-left:1px solid #33353f}
.ruler span:first-child{transform:none}
.lane{position:relative;height:72px;background:#0c0d11;border-radius:0 0 6px 6px;cursor:crosshair;overflow:hidden}
.tlmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:12px;pointer-events:none}
.trim{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#1b1c23 0 6px,#121318 6px 12px);pointer-events:none}
.leadw{position:absolute;top:0;bottom:0;opacity:.14;pointer-events:none}
.mk{position:absolute;top:8px;bottom:8px;width:4px;margin-left:-2px;border-radius:2px;cursor:grab;touch-action:none}
.mk span{position:absolute;top:0;left:6px;font-size:10px;font-weight:700;white-space:nowrap;padding:1px 5px;border-radius:3px;color:#111;pointer-events:none}
.mk.sel{box-shadow:0 0 0 2px #fff}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none;box-shadow:0 0 6px rgba(255,255,255,.5)}
.pop{position:absolute;top:104px;z-index:5;width:340px;transform:translateX(-50%);background:#1d1f27;border:1px solid #3a3d4a;border-radius:8px;padding:10px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.55);user-select:text;-webkit-user-select:text}
.pop .row input[data-pop=t]{width:90px;font-variant-numeric:tabular-nums}
.pop .types{display:flex;gap:4px;flex-wrap:wrap}
.pop .types button{font-size:11px;padding:3px 7px;font-weight:700}
.pop .types button.on{color:#111}
.pop .lead{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.pop .lead input{width:58px}
.pop label{margin:0}
.pop .emo button{padding:3px 6px;font-size:16px;line-height:1}
.pop .emo button.on{border-color:var(--acc);background:#3a2a22}
.pop .emo input{padding:4px 6px}
.pop .bpmo{width:64px}
.bpmrow{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.bpmrow input{width:84px;font-variant-numeric:tabular-nums}
.bpmrow .tap{min-width:92px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bpmrow .tap.hit{transform:scale(.94);filter:brightness(1.3)}
#tapInfo{font-size:12px;color:var(--mut)}
.gbeat{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.05);pointer-events:none}
.gbar{background:rgba(255,255,255,.13)}
.bpmrow .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.btk{position:absolute;bottom:0;height:10px;width:1px;background:rgba(255,255,255,.35);pointer-events:none}
.hint{color:var(--mut);font-size:12px;margin:8px 0 0}
.etabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.etabs button{border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--mut);padding:9px 14px}
.etabs button.on{color:var(--text);background:var(--panel);box-shadow:inset 0 -2px var(--acc)}
.etabs+.card{margin-top:0;border-top-left-radius:0}
.lmk{position:absolute;top:10px;bottom:10px;width:3px;margin-left:-1px;border-radius:2px;background:#8fb3ff;cursor:grab;touch-action:none}
.lmk span{position:absolute;top:0;left:5px;font-size:10px;white-space:nowrap;color:#cfdcff;pointer-events:none;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.lmk.cur{background:#fff}
.lyr{margin-top:14px;line-height:2.6;font-size:15px}
.lyr .stanza{display:block;height:10px}
.lyr .lp{position:relative;display:inline-block;padding:2px 8px;margin:0 2px;border-radius:6px;cursor:pointer;background:#1f2129;border:1px solid transparent;line-height:1.6;vertical-align:middle}
.lyr .lp:hover{border-color:#4a4d5c}
.lyr .lp small{position:absolute;top:-15px;left:6px;font-size:10px;color:#8fb3ff;font-variant-numeric:tabular-nums;line-height:1}
.lyr .lp.unset{color:var(--mut);background:transparent;border-style:dashed;border-color:#33353f}
.lyr .lp.next{border-color:var(--acc);border-style:solid}
.lyr .lp.cur{background:#3a2a22;color:#fff}
.lyr .lp i{display:none;position:absolute;top:-8px;right:-6px;width:16px;height:16px;border-radius:50%;background:#3a3d4a;color:#fff;font-style:normal;font-size:11px;line-height:16px;text-align:center}
.lyr .lp:hover i{display:block}
.lyr-tools{margin-top:12px;flex-wrap:wrap}
.lyr-tools button{font-size:12px;padding:4px 8px}
.bgnow{display:flex;gap:16px;align-items:center}
.bgprev{width:240px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0c0d11;flex:none;position:relative;display:grid;place-items:center;color:var(--mut);font-size:12px}
.bgprev video,.bgprev img{width:100%;height:100%;object-fit:cover;display:block}
.bgprev img{filter:blur(10px) brightness(.6);transform:scale(1.15)}
.bgprev .tag{position:absolute;left:6px;bottom:6px;font-size:10px;background:rgba(0,0,0,.65);border-radius:4px;padding:1px 6px;color:#ddd}
.vlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.vcard{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#0c0d11;position:relative}
.vcard.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.vcard video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.vcard .vm{padding:6px 8px;font-size:12px}
.vcard .vm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .vm small{font-size:11px}
.vcard .vdel{position:absolute;top:5px;right:5px;padding:1px 7px;font-size:11px;background:rgba(0,0,0,.6)}
.vcard .miss{aspect-ratio:16/9;display:grid;place-items:center;color:var(--warn);font-size:11px;text-align:center;padding:8px}
.card h4{margin:18px 0 0;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.08em}
details.lyrin summary{cursor:pointer;color:var(--mut);font-size:12px;letter-spacing:.12em;font-weight:600}
details.lyrin textarea{margin-top:10px;min-height:180px;font-size:14px;line-height:1.7}
details.cuelist{margin-top:12px}
details.cuelist summary{cursor:pointer;color:var(--mut);font-size:12px}
table.cues{width:100%;border-collapse:collapse;margin-top:8px}
.cues td,.cues th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.cues th{color:var(--mut);font-weight:500;font-size:11px}
.cues input.sm{width:84px;font-variant-numeric:tabular-nums}
.cues input.xs{width:60px}
.cues select{width:118px}
.cues .act{white-space:nowrap;text-align:right}
.empty{color:var(--mut);max-width:600px;line-height:1.9}
.empty b{color:var(--text)}
#scanWrap{position:fixed;right:16px;bottom:16px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;color:var(--mut);z-index:10}
#scanWrap iframe{display:block;border-radius:4px}
#scanLabel{margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 12px;font-size:15px}
.evrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.evrow .cur{color:var(--acc);font-size:11px;margin-left:6px}
@media (max-width:900px){.layout{grid-template-columns:1fr;height:auto}.scroll{max-height:55vh}.tc,.grid{grid-template-columns:1fr 1fr}main{padding:16px}header{overflow-x:auto}}
</style>
</head>
<body>
<header>
  <h1>LISTENING PARTY</h1>
  <button id="evBtn">행사 ▾</button>
  <input id="evName" style="width:170px" title="이름을 바꾸면 새 이름으로 따로 저장됩니다(복제)">
  <span id="saveInfo"></span>
  <span style="flex:1"></span>
  <span id="liveInfo"></span>
  <input id="tokenInput" type="password" placeholder="관리자 토큰" style="width:130px">
  <button id="resetBtn" title="공개된 곡·별점·댓글을 모두 지웁니다 (리허설 후)">공개 초기화</button>
  <button id="screenBtn" title="같은 브라우저의 새 창으로 엽니다. 전체화면은 송출 창에서 F">송출 화면 ↗</button>
  <a class="btn" href="/" target="_blank" style="text-decoration:none">참가자 화면 ↗</a>
</header>
<div class="warnbar" id="updBar" hidden>새 버전이 배포됐습니다. 송출 화면과 함께 쓰려면 이 창도 새로고침해야 합니다. <button onclick="location.reload()" style="margin-left:8px">지금 새로고침</button> <span class="mut" style="font-size:12px">(입력한 내용은 저장돼 있습니다)</span></div>
<div class="warnbar" id="warn" hidden>file:// 로 열면 YouTube가 재생을 거부합니다(오류 153). 배포된 주소의 /admin/ 으로 여세요.</div>
<div class="layout">
  <aside>
    <div class="tabs"><button data-tab="set">행사 순서</button><button data-tab="lib">전체 곡 <span id="libCount" class="mut"></span></button></div>

    <div class="pane" id="paneSet">
      <div class="summary" id="setSummary"></div>
      <div class="scroll" id="setList"></div>
    </div>

    <div class="pane" id="paneLib" hidden>
      <div class="load">
        <input id="plInput" placeholder="YouTube 재생목록 URL 또는 ID">
        <input id="keyInput" type="password" placeholder="YouTube Data API 키 (선택)">
        <div class="row"><button class="primary" id="loadBtn" style="flex:1">재생목록 불러오기</button><button id="scanBtn">임베드 검증</button></div>
        <div class="row"><input id="urlInput" placeholder="영상 URL로 한 곡 추가"><button id="addUrlBtn">추가</button></div>
      </div>
      <div class="toolbar"><label class="tog"><input type="checkbox" id="selAll"> 전체</label><button id="selUnBtn">미배정만 선택</button><span style="flex:1"></span><span id="selInfo" class="mut" style="font-size:12px"></span></div>
      <div class="toolbar"><select id="selTarget"></select><button class="primary" id="selAdd">에 넣기</button><button id="selOut">세션에서 빼기</button><button id="selDel">삭제</button></div>
      <div class="summary" id="libSummary"></div>
      <ol class="lib scroll" id="libList"></ol>
    </div>

    <div id="status"></div>
  </aside>
  <main>
    <div class="wrap">
      <div id="trackHead" hidden>
        <div class="th"><span class="num" id="hNum"></span>
          <div class="thx"><h2 id="hTitle"></h2><p class="sub" id="hSub"></p></div>
          <button class="primary" data-pub>참가자에게 공개</button></div>
      </div>
      <div id="playerBox" hidden><div id="player"></div><div id="cd" hidden></div></div>
      <div class="transport" id="transport" hidden>
        <button data-tp="prev" title="이전 곡">⏮</button><button data-tp="play" id="playBtn" style="min-width:42px">▶</button><button data-tp="next" title="다음 곡">⏭</button>
        <span id="now">0:00.0</span>
        <span style="flex:1"></span>
        <label class="tog" title="곡이 끝나면 같은 세션의 다음 곡을 자동으로 재생합니다. 세션 마지막 곡이 끝나면 멈춥니다."><input type="checkbox" id="optAuto"> 세션 안에서 연속 재생</label>
        <div id="elsewhere" hidden>지금 재생 중: <b id="elseTitle"></b><span style="flex:1"></span><button data-tp="goto">그 곡으로 이동</button><button data-tp="swap">이 곡으로 바꾸기</button></div>
      </div>
      <div id="trackBody"></div>
    </div>
  </main>
</div>
<div id="scanWrap" hidden><div id="scanner"></div><div id="scanLabel">스캔 준비 중…</div></div>

<dialog id="evDlg">
  <h3>행사</h3>
  <div id="evList" class="mut">불러오는 중…</div>
  <div class="row" style="margin-top:14px;flex-wrap:wrap">
    <button class="primary" id="evNew">+ 새 행사</button>
    <button id="evExport">파일로 내보내기</button>
    <label class="btn" style="margin:0;font-size:13px;color:var(--text)">파일 가져오기<input type="file" id="importInput" accept=".json" hidden></label>

  </div>
  <p class="hint">행사는 서버에 자동 저장됩니다. 위쪽 행사 이름을 바꾸면 새 이름으로 따로 저장되고(복제), 원래 행사는 그대로 남습니다.</p>
</dialog>

<script src="/vendor/Sortable.min.js"></script>
<script>
const TYPES=['DROP','SING','SHOUT','MOVE','HIGHLIGHT','REVEAL'];
const TCOL={DROP:'#ff5a36',SING:'#4ea1ff',SHOUT:'#f5b84a',MOVE:'#3ecf8e',HIGHLIGHT:'#c58bff',REVEAL:'#ffffff'};
const TLABEL={REVEAL:'곡 공개'};
const tlabel=y=>TLABEL[y]||y;
const EMOJIS=['❤️','🎉','👏','😄','💃'];
// '곡 공개' 마커가 있으면 그 시점까지 참가자 앱·송출 화면에 곡 정보를 숨긴다
const revealAt=t=>{const r=t.cues.filter(c=>c.type==='REVEAL').map(c=>c.t);return r.length?Math.min(...r):null;};
// 화면에 띄울 게 있는 큐만 카운트다운 (문구 없는 '곡 공개'는 조용히 공개만)
const showsOverlay=c=>c.type!=='REVEAL'||c.cd||c.msg||c.emoji;
const DEFAULT_SESSIONS=['세로토닌 & 옥시토신','미드나잇 드라이브','움직여!','론리 시티 서울','축제의 시간'];
const F=[['title','제목'],['artist','아티스트'],['album','앨범'],['year','발매연도'],
  ['notes','곡 해설','area'],['reason','선정 이유 (참가자에게 안 보임)','area'],['related','관련곡 (한 줄에 하나)','area']];
const LS='lp_proto_v1';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=m=>{$('#status').textContent=m;};
const uid=()=>Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');

/* ================= 시간 ================= */
function fmt(s){if(s==null||isNaN(s))return '--:--';s=Math.max(0,+s);const m=Math.floor(s/60),r=s-m*60;return m+':'+r.toFixed(1).padStart(4,'0');}
function fmtD(s){if(s==null||isNaN(s))return '--:--';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+pad(m):m)+':'+pad(r);}
function parseTC(v){v=String(v).trim();if(!v)return null;const p=v.split(':').map(Number);if(p.some(isNaN))return null;return p.reduce((a,b)=>a*60+b,0);}
function isoDur(d){const m=d.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/)||[];return (+(m[1]||0))*86400+(+(m[2]||0))*3600+(+(m[3]||0))*60+(+(m[4]||0));}
function runtime(t){const end=t.end??t.duration;return end?Math.max(0,end-(t.start||0)):null;}
const sumRt=list=>list.reduce((a,t)=>a+(runtime(t)||0),0);
function parsePl(v){v=v.trim();try{const u=new URL(v);return u.searchParams.get('list')||'';}catch(e){return v;}}
function parseVid(v){v=v.trim();const m=v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(v)?v:null);}
function errMsg(c){return({2:'잘못된 영상 ID',5:'HTML5 재생 오류',100:'삭제/비공개 영상',101:'임베드 차단',150:'임베드 차단',153:'리퍼러 없음 — file://로 열었음'})[c]||('오류 '+c);}

/* ================= 상태 ================= */
function blank(id){return{id,ytTitle:'',ytChannel:'',duration:null,durSrc:'',embed:'unknown',err:'',title:'',artist:'',album:'',year:'',reason:'',notes:'',related:'',start:0,end:null,cues:[]};}
function migrate(s){
  s=s&&typeof s==='object'?s:{};
  s.tracks=Array.isArray(s.tracks)?s.tracks:[];
  s.tracks.forEach(t=>{
    t.cues=Array.isArray(t.cues)?t.cues:[];prefill(t);
    if(t.points){t.notes=[t.notes,t.points].filter(Boolean).join('\n\n');}
    delete t.points;delete t.tension;
  });
  if(!Array.isArray(s.sessions)){
    // 이전 버전(곡마다 session 문자열) → 세션 목록으로
    s.sessions=DEFAULT_SESSIONS.map((n,i)=>{const full=pad(i+1)+' '+n;return{id:'s'+(i+1),name:n,desc:'',ids:s.tracks.filter(t=>t.session===full).map(t=>t.id)};});
  }
  s.tracks.forEach(t=>delete t.session);
  const known=new Set(s.tracks.map(t=>t.id)),seen=new Set();
  s.sessions.forEach(x=>{x.id=x.id||'s'+uid();x.name=x.name??'';x.desc=x.desc||'';x.ids=(x.ids||[]).filter(id=>known.has(id)&&!seen.has(id)&&seen.add(id));});
  s.visuals=Array.isArray(s.visuals)?s.visuals:[];s.name=s.name||'첫 행사';s.playlistId=s.playlistId||'';s.serverAt=s.serverAt||0;
  return s;
}
let state=migrate(null);
try{const s=localStorage.getItem(LS);if(s)state=migrate(JSON.parse(s));}catch(e){}
let opts={auto:true,tab:'set',snap:true};
try{Object.assign(opts,JSON.parse(localStorage.getItem(LS+'_opts')||'{}'));}catch(e){}
const saveOpts=()=>{try{localStorage.setItem(LS+'_opts',JSON.stringify(opts));}catch(e){}};
function persist(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
let persistT;
function save(render=true){clearTimeout(persistT);persistT=setTimeout(persist,250);scheduleSync();if(render)renderSide();}

const cur=()=>(location.hash.match(/#t=([\w-]+)/)||[])[1]||null;
const trackOf=id=>state.tracks.find(t=>t.id===id);
const sessionOf=id=>state.sessions.find(s=>s.ids.includes(id))||null;
const setlist=()=>state.sessions.flatMap(s=>s.ids.map(trackOf).filter(Boolean));
const posOf=id=>setlist().findIndex(t=>t.id===id)+1;
const dotColor=t=>t.embed==='ok'?'var(--ok)':t.embed==='no'?'var(--bad)':'var(--mut)';
const embedLabel=t=>t.embed==='ok'?'재생 가능':t.embed==='no'?'<span style="color:var(--bad)">'+esc(t.err)+'</span>':'미검증'+(t.err?' · '+esc(t.err):'');

function clean(o){Object.keys(o).forEach(k=>{if(o[k]===undefined||(o[k]===''&&k!=='err'))delete o[k];});return o;}
function prefill(t){
  if(t.title||t.artist||!t.ytTitle)return;
  const s=t.ytTitle.replace(/\s*[\(\[【][^\)\]】]*[\)\]】]\s*/g,' ').trim();
  const i=s.indexOf(' - ');
  if(i>0){t.artist=s.slice(0,i).trim();t.title=s.slice(i+3).trim();}else{t.title=s;t.artist=t.ytChannel||'';}
}
// 기존 곡 정보는 유지하고, 새 곡은 뒤에 추가
function mergeTracks(items){
  const map=new Map(state.tracks.map(t=>[t.id,t]));
  for(const it of items){let t=map.get(it.id);if(!t){t=blank(it.id);state.tracks.push(t);map.set(it.id,t);}Object.assign(t,clean({...it}));prefill(t);}
}
function assign(ids,sid){state.sessions.forEach(s=>s.ids=s.ids.filter(x=>!ids.includes(x)));const s=state.sessions.find(x=>x.id===sid);if(s)s.ids.push(...ids);save();updateHeader();}
function unassign(ids){state.sessions.forEach(s=>s.ids=s.ids.filter(x=>!ids.includes(x)));save();updateHeader();}

/* ================= 사이드바 ================= */
let sel=new Set(),lastSel=-1,sortables=[];
function renderSide(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===opts.tab));
  $('#paneSet').hidden=opts.tab!=='set';$('#paneLib').hidden=opts.tab!=='lib';
  $('#libCount').textContent=state.tracks.length||'';
  if(opts.tab==='set')renderSet();else renderLib();
}
function renderLib(){
  const c=cur();
  [...sel].forEach(id=>{if(!trackOf(id))sel.delete(id);});
  $('#libList').innerHTML=state.tracks.map(t=>{const s=sessionOf(t.id);return `<li class="${t.id===c?'on':''}"><input type="checkbox" data-sel="${t.id}" ${sel.has(t.id)?'checked':''}><a href="#t=${t.id}"><span class="t"><span class="dot" style="background:${dotColor(t)}"></span>${esc(t.title||t.ytTitle||t.id)}</span><small>${esc(t.artist||t.ytChannel||'')}</small></a>${s?`<span class="stag" title="${esc(s.name)}">${esc(s.name)}</span>`:'<span></span>'}<span class="dur">${fmtD(runtime(t))}</span></li>`;}).join('')
    ||'<li style="display:block;color:var(--mut)">재생목록이나 영상 URL로 곡을 불러오세요.</li>';
  const prev=$('#selTarget').value;
  $('#selTarget').innerHTML=state.sessions.map((s,i)=>`<option value="${s.id}">${pad(i+1)} ${esc(s.name)}</option>`).join('');
  if(state.sessions.some(s=>s.id===prev))$('#selTarget').value=prev;
  $('#selAll').checked=state.tracks.length>0&&sel.size===state.tracks.length;
  $('#selInfo').textContent=sel.size?`${sel.size}곡 선택됨`:'Shift+클릭으로 범위 선택';
  const un=state.tracks.filter(t=>!sessionOf(t.id)).length,bad=state.tracks.filter(t=>t.embed==='no').length,miss=state.tracks.filter(t=>!t.duration).length;
  $('#libSummary').innerHTML=state.tracks.length?`전체 ${state.tracks.length}곡 · 세션 미배정 <b>${un}</b>${bad?` · <span style="color:var(--bad)">재생 불가 ${bad}</span>`:''}${miss?` · 길이 미확인 ${miss}`:''}`:'';
}
function renderSet(){
  const c=cur();let n=0;
  sortables.forEach(s=>s.destroy());sortables=[];
  const all=setlist();
  $('#setSummary').innerHTML=all.length?`${state.sessions.length}개 세션 · ${all.length}곡 · 총 <b>${fmtD(sumRt(all))}</b>`:'전체 곡 탭에서 곡을 체크해 세션에 넣으세요.';
  $('#setList').innerHTML=state.sessions.map((s,si)=>{
    const ts=s.ids.map(trackOf).filter(Boolean);
    return `<div class="sess"><div class="sh"><span class="snum">${pad(si+1)}</span><input data-sname="${s.id}" value="${esc(s.name)}" placeholder="세션 이름"><span class="stime">${ts.length}곡 · ${fmtD(sumRt(ts))}</span>
      <button data-smove="${s.id}" data-d="-1" ${si?'':'disabled'} title="위로">↑</button><button data-smove="${s.id}" data-d="1" ${si<state.sessions.length-1?'':'disabled'} title="아래로">↓</button><button data-sdel="${s.id}" title="세션 삭제">✕</button></div>
      <div class="sdesc"><textarea data-sdesc="${s.id}" rows="1" placeholder="세션 설명 (참가자 앱에 보임)">${esc(s.desc)}</textarea></div>
      <ol class="sl" data-sid="${s.id}">${ts.map(t=>`<li data-id="${t.id}" class="${t.id===c?'on':''} ${t.id===playerId?'playing':''}"><span class="handle" title="끌어서 순서 변경">⋮⋮</span><span class="idx">${pad(++n)}</span><a href="#t=${t.id}"><span class="t"><span class="dot" style="background:${dotColor(t)}"></span>${esc(t.title||t.ytTitle||t.id)}</span><small>${esc(t.artist||t.ytChannel||'')}${t.cues.length?' · 큐 '+t.cues.length:''}</small></a><span class="dur">${fmtD(runtime(t))}</span><button class="out" data-out="${t.id}" title="세션에서 빼기">✕</button></li>`).join('')}</ol></div>`;
  }).join('')+`<div style="padding:12px 14px"><button id="addSess">+ 세션 추가</button></div>`;
  if(window.Sortable)document.querySelectorAll('#setList .sl').forEach(ol=>sortables.push(Sortable.create(ol,{group:'setlist',handle:'.handle',animation:120,emptyInsertThreshold:24,onEnd:()=>setTimeout(syncSetFromDom,0)})));
  else status('순서 변경 라이브러리를 불러오지 못했습니다');
}
function syncSetFromDom(){
  document.querySelectorAll('#setList .sl').forEach(ol=>{const s=state.sessions.find(x=>x.id===ol.dataset.sid);if(s)s.ids=[...ol.children].map(li=>li.dataset.id).filter(Boolean);});
  save();updateHeader();
}

const side=$('aside');
side.addEventListener('click',e=>{
  const cb=e.target.closest('input[data-sel]');
  if(cb){
    const ids=state.tracks.map(t=>t.id),i=ids.indexOf(cb.dataset.sel);
    if(e.shiftKey&&lastSel>=0){const [a,b]=[Math.min(i,lastSel),Math.max(i,lastSel)];ids.slice(a,b+1).forEach(id=>cb.checked?sel.add(id):sel.delete(id));}
    else cb.checked?sel.add(cb.dataset.sel):sel.delete(cb.dataset.sel);
    lastSel=i;renderLib();return;
  }
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){opts.tab=b.dataset.tab;saveOpts();renderSide();return;}
  if(b.id==='addSess'){state.sessions.push({id:'s'+uid(),name:'새 세션',desc:'',ids:[]});save();return;}
  if(b.dataset.smove){const i=state.sessions.findIndex(s=>s.id===b.dataset.smove),j=i+(+b.dataset.d);[state.sessions[i],state.sessions[j]]=[state.sessions[j],state.sessions[i]];save();updateHeader();return;}
  if(b.dataset.sdel){const s=state.sessions.find(x=>x.id===b.dataset.sdel);if(s.ids.length&&!confirm(`"${s.name}" 세션을 지웁니다. 안의 ${s.ids.length}곡은 세션 미배정으로 돌아갑니다.`))return;state.sessions=state.sessions.filter(x=>x!==s);save();updateHeader();return;}
  if(b.dataset.out){unassign([b.dataset.out]);return;}
  if(b.id==='selUnBtn'){sel=new Set(state.tracks.filter(t=>!sessionOf(t.id)).map(t=>t.id));renderLib();return;}
  if(b.id==='selAdd'){if(!sel.size)return status('곡을 먼저 체크하세요');if(!state.sessions.length)return status('행사 순서 탭에서 세션을 먼저 만드세요');
    const ids=state.tracks.filter(t=>sel.has(t.id)).map(t=>t.id),s=state.sessions.find(x=>x.id===$('#selTarget').value);
    assign(ids,s.id);status(`${ids.length}곡을 "${s.name}"에 넣었습니다`);sel.clear();renderLib();return;}
  if(b.id==='selOut'){if(!sel.size)return;unassign([...sel]);sel.clear();renderLib();return;}
  if(b.id==='selDel'){if(!sel.size)return;if(!confirm(`${sel.size}곡을 목록에서 삭제합니다. 입력한 곡 정보도 함께 지워집니다.`))return;
    const del=new Set(sel);state.tracks=state.tracks.filter(t=>!del.has(t.id));state.sessions.forEach(s=>s.ids=s.ids.filter(x=>!del.has(x)));sel.clear();save();route();return;}
  if(b.id==='loadBtn'){load();return;}
  if(b.id==='scanBtn'){state.tracks.length?scanTracks(state.tracks):status('먼저 곡을 불러오세요');return;}
  if(b.id==='addUrlBtn'){addUrl();return;}
});
side.addEventListener('change',e=>{
  if(e.target.id==='selAll'){e.target.checked?state.tracks.forEach(t=>sel.add(t.id)):sel.clear();renderLib();}
});
side.addEventListener('input',e=>{
  const sn=e.target.dataset.sname,sd=e.target.dataset.sdesc;
  if(sn){state.sessions.find(s=>s.id===sn).name=e.target.value;save(false);updateHeader();}
  if(sd){state.sessions.find(s=>s.id===sd).desc=e.target.value;save(false);}
});
$('#urlInput').addEventListener('keydown',e=>{if(e.key==='Enter')addUrl();});

/* ================= YouTube 불러오기 ================= */
let ytReady=false;const ytQ=[];
window.onYouTubeIframeAPIReady=()=>{ytReady=true;ytQ.splice(0).forEach(f=>f());};
const whenYT=()=>new Promise(r=>ytReady?r():ytQ.push(r));

async function playlistIdsAPI(pl,key){
  const ids=[];let tok='';
  do{const r=await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${encodeURIComponent(pl)}&key=${encodeURIComponent(key)}${tok?'&pageToken='+tok:''}`);
    const j=await r.json();if(j.error)throw new Error(j.error.message);j.items.forEach(i=>ids.push(i.contentDetails.videoId));tok=j.nextPageToken||'';}while(tok);
  return ids;
}
async function videosAPI(ids,key){
  const info={};
  for(let i=0;i<ids.length;i+=50){const r=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet,status&id=${ids.slice(i,i+50).join(',')}&key=${encodeURIComponent(key)}`);
    const j=await r.json();if(j.error)throw new Error(j.error.message);j.items.forEach(v=>info[v.id]=v);}
  return ids.map(id=>{const v=info[id];if(!v)return{id,embed:'no',err:'삭제/비공개 영상'};
    const rr=v.contentDetails.regionRestriction,kr=rr&&((rr.blocked||[]).includes('KR')||(rr.allowed&&!rr.allowed.includes('KR')));
    return{id,ytTitle:v.snippet.title,ytChannel:v.snippet.channelTitle.replace(/ - Topic$/,''),duration:isoDur(v.contentDetails.duration),durSrc:'api',
      embed:(!v.status.embeddable||kr)?'no':'unknown',err:!v.status.embeddable?'임베드 차단':kr?'KR 지역 제한':''};});
}
let scanner=null,scanEvt=null,scanning=false,stopFlag=false;
function getScanner(){
  return whenYT().then(()=>scanner?scanner:new Promise(res=>{
    const p=new YT.Player('scanner',{width:224,height:126,playerVars:{mute:1,playsinline:1,controls:0,rel:0},
      events:{onReady:()=>{scanner=p;res(p);},onStateChange:e=>scanEvt&&scanEvt('state',e.data),onError:e=>scanEvt&&scanEvt('error',e.data)}});
  }));
}
function waitEvt(test,ms){return new Promise(res=>{const to=setTimeout(()=>{scanEvt=null;res({timeout:true});},ms);scanEvt=(k,d)=>{const r=test(k,d);if(r){clearTimeout(to);scanEvt=null;res(r);}};});}
async function idsFromPlaylist(pl){
  const p=await getScanner();let err=null;
  scanEvt=(k,d)=>{if(k==='error')err=d;};
  p.cuePlaylist({list:pl,listType:'playlist'});
  for(let i=0;i<50;i++){await sleep(300);const l=p.getPlaylist&&p.getPlaylist();if(l&&l.length){scanEvt=null;return l;}if(err!=null&&i>10){scanEvt=null;throw new Error(errMsg(err));}}
  scanEvt=null;throw new Error('재생목록을 읽지 못함 — 비공개 목록이거나 ID가 틀렸을 수 있음');
}
async function scanOne(id){
  const p=await getScanner();
  const w=waitEvt((k,d)=>k==='state'&&d===1?{play:1}:k==='error'?{err:d}:null,15000);
  p.mute();p.loadVideoById(id);
  const r=await w;
  if(r.play){let d=0;for(let i=0;i<20;i++){d=p.getDuration();if(d)break;await sleep(150);}
    const vd=p.getVideoData?p.getVideoData():{};p.pauseVideo();
    return{duration:d||undefined,durSrc:'scan',ytTitle:vd.title,ytChannel:(vd.author||'').replace(/ - Topic$/,''),embed:'ok',err:''};}
  if(r.timeout){try{p.stopVideo();}catch(e){}return{embed:'unknown',err:'응답 없음(광고·버퍼링?) — 다시 검증해보세요'};}
  return{embed:'no',err:errMsg(r.err)};
}
async function scanTracks(list){
  if(scanning){stopFlag=true;return;}
  if(!list.length){$('#scanWrap').hidden=true;return;}
  scanning=true;stopFlag=false;$('#scanWrap').hidden=false;$('#scanBtn').textContent='검증 중지';
  for(let i=0;i<list.length&&!stopFlag;i++){
    const t=list[i];if(!trackOf(t.id))continue;
    $('#scanLabel').textContent=`${i+1}/${list.length} ${t.title||t.ytTitle||t.id}`;status(`곡 확인 중 ${i+1}/${list.length}`);
    const r=await scanOne(t.id);
    if(t.durSrc==='api'&&t.duration){delete r.duration;delete r.durSrc;}
    Object.assign(t,clean(r));prefill(t);save();
  }
  try{scanner.stopVideo();}catch(e){}
  $('#scanWrap').hidden=true;$('#scanBtn').textContent='임베드 검증';scanning=false;
  const bad=state.tracks.filter(t=>t.embed==='no').length,unk=state.tracks.filter(t=>t.embed==='unknown').length;
  status(`확인 ${stopFlag?'중지':'완료'} — 재생 불가 ${bad}곡, 미확인 ${unk}곡`);
  updateHeader();const t=trackOf(cur());if(t){renderTimeline(t);fillTC(t);}
}
async function load(){
  const pl=parsePl($('#plInput').value),key=$('#keyInput').value.trim();
  if(!pl)return status('재생목록 URL 또는 ID를 넣으세요');
  try{localStorage.setItem(LS+'_key',key);}catch(e){}
  state.playlistId=pl;$('#loadBtn').disabled=true;
  const before=new Set(state.tracks.map(t=>t.id));
  try{
    if(key){
      status('Data API로 불러오는 중…');
      const ids=await playlistIdsAPI(pl,key);mergeTracks(await videosAPI(ids,key));save();
      status(`${ids.length}곡 · 새로 추가 ${ids.filter(i=>!before.has(i)).length}곡 · 실제 재생 여부는 '임베드 검증'으로`);
    }else{
      $('#scanWrap').hidden=false;status('재생목록 읽는 중…');
      const ids=await idsFromPlaylist(pl);mergeTracks(ids.map(id=>({id})));save();
      status(`${ids.length}곡 · 새로 추가 ${ids.filter(i=>!before.has(i)).length}곡`);
      $('#loadBtn').disabled=false;
      await scanTracks(state.tracks.filter(t=>!before.has(t.id)||!t.duration));
    }
  }catch(e){status('오류: '+e.message);$('#scanWrap').hidden=true;}
  $('#loadBtn').disabled=false;route();
}
async function addUrl(){
  const id=parseVid($('#urlInput').value);
  if(!id)return status('영상 URL을 알아볼 수 없습니다');
  if(trackOf(id))return status('이미 목록에 있는 곡입니다');

/* ================= 메인 플레이어 ================= */
let player=null,playerId=null,autoplayId=null,lastPub=null,lastMyst=null,advT=0;
const live=()=>player&&player!=='pending';
const ptime=()=>live()&&player.getCurrentTime?player.getCurrentTime():null;
const pstate=()=>live()&&player.getPlayerState?player.getPlayerState():-1;
async function showPlayer(id){
  await whenYT();
  if(!player){
    player='pending';const t0=trackOf(id);
    await new Promise(res=>{const p=new YT.Player('player',{width:'100%',height:'100%',videoId:id,playerVars:{playsinline:1,rel:0,start:Math.floor(t0?.start||0)},
      events:{onReady:()=>{player=p;playerId=id;res();},onStateChange:onPState,onError:e=>status('플레이어: '+errMsg(e.data))}});});
    if(autoplayId===id){autoplayId=null;player.playVideo();}
    id=cur();if(!id||id===playerId)return;
  }
  if(!live())return;
  const t=trackOf(id);if(!t)return;
  if(autoplayId===id){autoplayId=null;playerId=id;player.loadVideoById({videoId:id,startSeconds:t.start||0});renderSide();return;}
  if(playerId===id)return;
  // 다른 곡이 재생 중이면 끊지 않는다
  if(pstate()===1||pstate()===3)return;
  playerId=id;player.cueVideoById({videoId:id,startSeconds:t.start||0});
}
function onPState(e){
  const t=trackOf(playerId);
  if(e.data===0&&opts.auto)advance(1,false);
  if(e.data===1&&t&&lastPub!==t.id){
    const rv=revealAt(t);
    if(rv!=null&&(ptime()??0)<rv){if(lastMyst!==t.id){lastMyst=t.id;publishMystery(t);}}
    else{lastPub=t.id;publish(t,true);}
  }
  if(e.data===1||e.data===0)renderSide();
}
// 이웃 곡: 자동 진행은 같은 세션 안에서만, 버튼은 세션을 넘어서
function neighbor(id,dir,sameSession){
  const s=sessionOf(id);
  if(s&&sameSession){const i=s.ids.indexOf(id);return trackOf(s.ids[i+dir])||null;}
  const list=s?setlist():state.tracks;const i=list.findIndex(t=>t.id===id);
  return i<0?null:list[i+dir]||null;
}
function advance(dir,manual){
  if(!manual&&Date.now()-advT<1500)return;
  advT=Date.now();
  const from=playerId||cur(),n=neighbor(from,dir,!manual);
  if(!n){
    if(!manual){const s=sessionOf(from);status(s?`"${s.name}" 세션이 끝났습니다. 다음 세션은 ⏭로 시작하세요.`:'다음 곡이 없습니다');try{player.pauseVideo();}catch(e){}}
    else status(dir>0?'마지막 곡입니다':'첫 곡입니다');
    return;
  }
  autoplayId=n.id;
  if(cur()===n.id)showPlayer(n.id);else location.hash='t='+n.id;
}

/* ================= 참가자 앱 연동 ================= */
const token=()=>$('#tokenInput').value.trim();
async function api(path,method='GET',data,extraHeaders){
  if(location.protocol==='file:')throw new Error('배포된 주소에서만 동작합니다');
  const r=await fetch(path,{method,headers:{'content-type':'application/json','x-admin-token':token(),...extraHeaders},body:data===undefined?undefined:JSON.stringify(data)});
  if(!r.ok){const err=new Error(r.status===401?'관리자 토큰이 틀렸습니다':await r.text());err.status=r.status;throw err;}
  return r.json();
}
const programData=()=>({sessions:state.sessions.map(s=>({id:s.id,name:s.name,desc:s.desc||'',count:s.ids.length}))});
let lastProgram='';
async function postProgram(force){
  const p=JSON.stringify(programData());
  if(!force&&p===lastProgram)return;
  await api('/api/program','POST',programData());lastProgram=p;
}
const publicTrack=t=>({...t,title:t.title||t.ytTitle||'(제목 없음)',artist:t.artist||t.ytChannel||'',sid:sessionOf(t.id)?.id||'',index:posOf(t.id),img:t.img||''});
async function publishMystery(t){
  if(!token())return;
  try{await postProgram();await api('/api/now','POST',{mystery:true,sid:sessionOf(t.id)?.id||'',index:posOf(t.id)});
    status(`재생 시작 → "${t.title||t.ytTitle}" 곡 정보는 ${fmtD(revealAt(t))}에 공개됩니다`);refreshLive();}
  catch(e){status('공개 실패: '+e.message);lastMyst=null;}
}
async function publish(t,auto){
  if(!token()){if(auto)status('관리자 토큰이 없어 참가자 앱에 공개되지 않았습니다');else status('관리자 토큰을 입력하세요');return;}
  try{
    await postProgram();
    const r=await api('/api/now','POST',publicTrack(t));
    status(`${auto?'재생 시작 → ':''}"${t.title||t.ytTitle}" 공개됨 · 접속 ${r.listeners}명`);refreshLive();
  }catch(e){status('공개 실패: '+e.message);if(auto)lastPub=null;}
}
async function refreshLive(){
  if(location.protocol==='file:')return;
  try{const s=await (await fetch('/api/state')).json();$('#liveInfo').textContent=`공개 ${s.unlocked.length}곡 · 접속 ${s.listeners}명`;}catch(e){}
}
$('#resetBtn').onclick=async()=>{
  if(!confirm('참가자 앱에 공개된 곡을 모두 다시 잠그고, 별점·댓글도 지웁니다. 리허설 후에 쓰세요. 계속할까요?'))return;
  try{await api('/api/reset','POST');lastPub=null;status('공개 초기화 완료');refreshLive();}catch(e){status('초기화 실패: '+e.message);}
};

/* ================= 서버 저장 (행사) ================= */
let syncT=null,conflict=false;
function setSave(m,warn){const el=$('#saveInfo');el.textContent=m;el.style.color=warn?'var(--warn)':'var(--mut)';el.title=m;}
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(syncNow,1500);}
async function syncNow(force){
  clearTimeout(syncT);
  if(location.protocol==='file:'||!token()){setSave('이 브라우저에만 저장됨 (토큰 입력 시 서버 저장)');return false;}
  if(conflict&&!force){setSave('⚠ 서버에 다른 버전이 있어 저장을 멈췄습니다 — 행사 ▾',true);return false;}
  try{
    const j=await api('/api/events/'+encodeURIComponent(state.name),'PUT',state,{'x-base':force?'force':String(state.serverAt||0)});
    state.serverAt=j.updatedAt;conflict=false;persist();
    setSave('서버 저장됨 '+new Date(j.updatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    postProgram().catch(()=>{});
    return true;
  }catch(e){
    if(e.status===409){conflict=true;setSave('⚠ 서버에 다른 버전이 있어 저장을 멈췄습니다 — 행사 ▾',true);}
    else setSave('서버 저장 실패: '+e.message,true);
    return false;
  }
}
async function checkServer(){
  if(location.protocol==='file:'||!token())return syncNow();
  try{
    const list=await api('/api/events');
    const m=list.find(x=>x.name===state.name);
    if(!m)return syncNow();
    if(m.updatedAt===state.serverAt){conflict=false;setSave('서버와 동기화됨');postProgram().catch(()=>{});}
    else{conflict=true;setSave('⚠ 서버에 다른 버전이 있어 저장을 멈췄습니다 — 행사 ▾',true);}
  }catch(e){setSave(e.status===401?'관리자 토큰이 틀렸습니다':'서버 확인 실패',true);}
}
async function openEvent(name){
  try{
    const r=await api('/api/events/'+encodeURIComponent(name));
    state=migrate(r.event);state.name=name;state.serverAt=r.updatedAt;conflict=false;persist();
    sel.clear();editCue=null;$('#evName').value=state.name;lastProgram='';
    if(location.hash)location.hash='';else route();
    setSave('서버에서 불러옴');postProgram().catch(()=>{});$('#evDlg').close();
  }catch(e){alert('불러오기 실패: '+e.message);}
}
async function renderEvents(){
  const box=$('#evList');

$('#evClose').onclick=()=>$('#evDlg').close();
$('#evList').addEventListener('click',async e=>{

$('#evNew').onclick=async()=>{

// 가운데를 정사각형으로 잘라 640px JPEG로
function squareJpeg(file,size=640){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const s=Math.min(img.naturalWidth,img.naturalHeight),c=document.createElement('canvas');
      c.width=c.height=Math.min(size,s);
      c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('이미지 변환 실패')),'image/jpeg',0.86);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('이미지를 읽을 수 없습니다'));};
    img.src=url;
  });
}
async function uploadImg(t,file){

  try{

    const blob=await squareJpeg(file);
    const r=await fetch('/api/img/'+t.id,{method:'PUT',headers:{'content-type':'image/jpeg','x-admin-token':token()},body:blob});
    if(!r.ok)throw new Error(r.status===401?'관리자 토큰이 틀렸습니다':await r.text());

let lastStamp=-1;
const lyrLines=t=>t.lyrics?.lines||[];
function applyLyrics(t,raw){
  const old=lyrLines(t).filter(l=>l.text).map(l=>({...l}));
  const out=[];let hasLrc=false;
  for(let line of raw.split(/\r?\n/)){
    line=line.trim();
    if(/^\[[a-z]+:.*\]$/i.test(line))continue;           // LRC 머리말 [ar:..]
    let tm=null,text=line;
    const m=line.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    if(m){hasLrc=true;tm=(+m[1])*60+(+m[2]);text=m[3].trim();}
    if(!text){if(out.length&&out.at(-1).text!=='')out.push({text:'',t:null});continue;}
    if(tm==null){const j=old.findIndex(o=>o.text===text);if(j>=0){tm=old[j].t;old.splice(0,j+1);}} // 같은 구절은 타이밍 유지
    out.push({text,t:tm});
  }
  while(out.length&&out.at(-1).text==='')out.pop();
  t.lyrics={raw:hasLrc?out.map(l=>l.text).join('\n'):raw,lines:out};
  lastStamp=-1;
}
const nextStampIdx=t=>{const L=lyrLines(t);for(let i=lastStamp+1;i<L.length;i++)if(L[i].text)return i;return -1;};
function curLyricIdx(t,now){let c=-1;lyrLines(t).forEach((l,i)=>{if(l.text&&l.t!=null&&l.t<=now&&(c<0||l.t>=lyrLines(t)[c].t))c=i;});return c;}

const idb=(()=>{let p;

  return{put:(k,v)=>run('readwrite',st=>st.put(v,k)),get:k=>run('readonly',st=>st.get(k)),del:k=>run('readwrite',st=>st.delete(k)),keys:()=>run('readonly',st=>st.getAllKeys())};
})();

async function uploadVideos(t,files){

/* ---------- 박자 (BPM) ---------- */
// 큐마다 BPM을 따로 줄 수 있고, 없으면 곡 BPM. 둘 다 없으면 초 단위로 센다
const cueBeat=(t,c)=>{const b=+(c.bpm||t.bpm);return b>0?60/b:0;};
const cueLead=(t,c)=>{const bt=cueBeat(t,c);return bt?(c.beats??4)*bt:(c.lead??5);};
const cueStep=c=>Math.max(1,Math.round(c.step||1));   // 몇 박(BPM 없으면 몇 초)마다 한 번씩 셀지
const cueCount=(t,c,now)=>Math.ceil((c.t-now-1e-6)/((cueBeat(t,c)||1)*cueStep(c)));
let taps=[],tapSong=[];
// 곡 재생 중에 탭하면 곡 시간도 기록 → 박이 곡의 어디에 떨어지는지(격자 위치)를 구한다
// 모든 탭을 지나는 가장 잘 맞는 직선: 기울기 = 박 길이, 절편 = 박 위치 (한두 번 삐끗해도 덜 흔들림)
function fitBeats(xs){
  const n=xs.length,mi=(n-1)/2,mx=xs.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(i-mi)*(x-mx);den+=(i-mi)**2;});
  return{beat:num/den,at:mx-mi*(num/den)};
}
const hasGrid=t=>t.bpm>0&&t.beat0!=null;
// 가장 가까운 박으로
function snapT(t,x){if(!hasGrid(t)||!opts.snap)return x;const b=60/t.bpm;return +(t.beat0+Math.round((x-t.beat0)/b)*b).toFixed(3);}
function tapTempo(t){
  const now=performance.now();
  if(taps.length&&now-taps.at(-1)>2000){taps=[];tapSong=[];}
  taps.push(now);if(taps.length>16)taps.shift();
  const playing=playerId===t.id&&pstate()===1;
  tapSong.push(playing?ptime():null);if(tapSong.length>16)tapSong.shift();
  const btn=$('.bpmrow .tap');if(btn){btn.classList.add('hit');setTimeout(()=>btn.classList.remove('hit'),90);}
  const info=$('#tapInfo');
  if(taps.length<3){if(info)info.textContent=`계속 탭하세요… (${taps.length})`;return;}
  // 재생 중 탭이 3번 이상이면 곡 시간으로, 아니면 실제 시간으로 잰다
  const st=tapSong.slice(-taps.length).filter(x=>x!=null),useSong=st.length>=3&&st.length===Math.min(taps.length,tapSong.length);
  const fit=useSong?fitBeats(st):fitBeats(taps.map(x=>x/1000));
  const raw=60/fit.beat,whole=Math.round(raw);
  const bpm=Math.abs(raw-whole)<0.4?whole:Math.round(raw*10)/10;   // 대부분의 곡은 정수 BPM
  t.bpm=bpm;if($('[data-bpm]'))$('[data-bpm]').value=bpm;
  const hadGrid=hasGrid(t);
  if(useSong){const b=60/bpm,a=st.reduce((acc,x,i)=>acc+(x-i*b),0)/st.length;t.beat0=+((a%b+b)%b).toFixed(3);}
  if(!hadGrid&&hasGrid(t)){save();renderTrack();const i2=$('#tapInfo');if(i2)i2.textContent=`${taps.length}번 탭 · ${bpm} BPM · 박 위치도 맞췄어요`;return;}
  if(info)info.textContent=`${taps.length}번 탭 · ${bpm} BPM${useSong?' · 박 위치도 맞췄어요':' · 재생 중에 탭하면 박 위치도 맞춰요'}`;
  save();renderTimeline(t);renderCues(t);
}

function tlDur(t){return t.duration||(live()&&playerId===t.id?player.getDuration():0)||0;}
function renderTimeline(t){
  const lane=$('#lane'),ruler=$('#ruler');if(!lane)return;
  const D=tlDur(t);
  if(!D){ruler.innerHTML='';lane.innerHTML='<div class="tlmsg">곡 길이를 아직 모릅니다 — 한 번 재생하면 타임라인이 생깁니다</div>';return;}
  const pct=s=>Math.min(100,Math.max(0,s/D*100))+'%';
  const step=D<=180?15:D<=420?30:60;
  let r='';for(let s=0;s<D-step/3;s+=step)r+=`<span style="left:${pct(s)}">${fmtD(s)}</span>`;
  ruler.innerHTML=r;
  const st=t.start||0,en=t.end??D;
  let h='';
  if(hasGrid(t)){const b=60/t.bpm;let k=Math.ceil(-t.beat0/b);
    for(let x=t.beat0+k*b;x<D;x+=b,k++)h+=`<div class="gbeat${k%4===0?' gbar':''}" style="left:${pct(x)}"></div>`;}
  if(st>0)h+=`<div class="trim" style="left:0;width:${pct(st)}"></div>`;
  if(en<D)h+=`<div class="trim" style="left:${pct(en)};right:0"></div>`;
  t.cues.forEach((c,j)=>{const col=TCOL[c.type]||'#fff';
    const ld=cueLead(t,c),bt=cueBeat(t,c);
    h+=`<div class="leadw" style="left:${pct(c.t-ld)};width:${Math.min(ld,c.t)/D*100}%;background:${col}"></div>`;
    if(bt){const u=bt*cueStep(c);for(let x=c.t-u;x>=c.t-ld-1e-6;x-=u)h+=`<div class="btk" style="left:${pct(x)}"></div>`;}
    h+=`<div class="mk${c===editCue?' sel':''}" data-mk="${j}" style="left:${pct(c.t)};background:${col}"><span style="background:${col}">${c.emoji?esc(c.emoji)+' ':''}${esc(c.msg||tlabel(c.type))}</span></div>`;});
  lane.innerHTML=h;
}

  const now=ptime(),t=trackOf(cur()),ps=pstate();
  const el=$('#now');if(el&&now!=null)el.textContent=fmt(now);
  $('#playBtn').textContent=ps===1&&playerId===cur()?'❚❚':'▶';
  // 다른 곡을 보고 있을 때 안내
  const pt=trackOf(playerId),away=!!(t&&pt&&playerId!==t.id&&(ps===1||ps===2||ps===3));
  $('#elsewhere').hidden=!away;if(away)$('#elseTitle').textContent=pt.title||pt.ytTitle;
  // 곡 길이를 플레이어에서 알게 되면 저장
  if(pt&&!pt.duration&&live()){const d=player.getDuration();if(d){pt.duration=d;pt.durSrc='player';save();if(t===pt){fillTC(t);renderTimeline(t);renderLyrTimeline(t);}}}
  // '곡 공개' 마커에 도달하면 공개
  if(pt&&ps===1&&lastPub!==pt.id){const rv=revealAt(pt);if(rv!=null&&now>=rv){lastPub=pt.id;publish(pt,true);}}
  // 음악 끝 지점에 도달하면 다음 곡
  if(pt&&opts.auto&&ps===1&&pt.end!=null&&now>=pt.end)advance(1,false);
  // 플레이헤드 · 카운트다운
  const cd=$('#cd'),ph=$('#ph');
  if(!t||now==null||playerId!==t.id){cd.hidden=true;if(ph)ph.hidden=true;if($('#lph'))$('#lph').hidden=true;return;}
  const D=tlDur(t);if(ph){ph.hidden=!D;if(D)ph.style.left=Math.min(100,now/D*100)+'%';}
  const lph=$('#lph');
  if(lph){lph.hidden=!D;if(D)lph.style.left=Math.min(100,now/D*100)+'%';
    const ci=curLyricIdx(t,now);
    document.querySelectorAll('.lp.cur').forEach(x=>{if(+x.dataset.li!==ci)x.classList.remove('cur');});
    if(ci>=0)document.querySelector(`.lp[data-li="${ci}"]`)?.classList.add('cur');
    document.querySelectorAll('.lmk').forEach(x=>x.classList.toggle('cur',+x.dataset.lmk===ci));}
  const c=t.cues.find(c=>showsOverlay(c)&&now>=c.t-cueLead(t,c)&&now<c.t+cueHold(t,c));
  if(c){cd.hidden=false;cd.innerHTML=now<c.t?`<div><b>${cueCount(t,c,now)}</b><span>${esc(c.cd||tlabel(c.type))}</span></div>`:`<b class="hit">${c.emoji?esc(c.emoji)+' ':''}${esc(c.msg||(c.emoji?'':tlabel(c.type)))}</b>`;}
  else cd.hidden=true;
},100);

/* ================= 시작 ================= */
function route(){renderSide();renderTrack();}
window.addEventListener('hashchange',route);
try{$('#keyInput').value=localStorage.getItem(LS+'_key')||'';$('#tokenInput').value=localStorage.getItem(LS+'_admin')||'';}catch(e){}
let tokT;
$('#tokenInput').addEventListener('input',()=>{try{localStorage.setItem(LS+'_admin',token());}catch(e){}clearTimeout(tokT);tokT=setTimeout(checkServer,600);});
$('#evName').value=state.name;
$('#optAuto').checked=opts.auto;
if(state.playlistId)$('#plInput').value=state.playlistId;
if(location.protocol==='file:')$('#warn').hidden=false;
route();
checkServer();refreshLive();setInterval(refreshLive,10000);
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);

/* ---------- 새 버전이 배포되면 알려주기 ---------- */
(()=>{
  const h=s=>{let x=0;for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))|0;return x;};
  let base=null;
  const check=async()=>{try{const r=await fetch(location.pathname,{cache:'no-store'});if(!r.ok)return;const v=h(await r.text());
    if(base===null)base=v;else if(v!==base)document.getElementById('updBar').hidden=false;}catch(e){}};
  check();setInterval(check,60000);
})();
</script>
