<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1014">
<title>THE LISTENING PARTY</title>
<style>
:root{--bg:#0f1014;--panel:#17181e;--panel2:#1c1d24;--line:#262833;--text:#e8e8ec;--mut:#8b8d98;--dim:#4a4c57;--acc:#ff5a36;--ok:#3ecf8e;--star:#ffc845}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
header h1{font-size:12px;letter-spacing:.18em;margin:0}
.conn{font-size:11px;color:var(--mut)}
.conn i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:5px;vertical-align:middle}
.conn.on i{background:var(--ok)}

/* ===== 지금 세션 + 지금 곡 ===== */
.stage{border-radius:22px;padding:22px 14px 14px;background:linear-gradient(180deg,#24181a 0%,#16171c 70%);border:1px solid #3a2724}
.stage-head{padding:0 6px 18px}
.stage-num{font-size:11px;letter-spacing:.26em;color:var(--acc);font-weight:800}
.stage-title{font-size:30px;line-height:1.2;margin:6px 0 0;font-weight:800;word-break:keep-all;letter-spacing:-.01em}
.stage-desc{margin:10px 0 0;font-size:14px;color:#b9bac2;white-space:pre-wrap}
.stage.plain{background:var(--panel);border-color:var(--line);padding-top:14px}
.now{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.label{font-size:10px;letter-spacing:.24em;color:var(--acc);font-weight:700}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;margin-right:6px;vertical-align:-1px}
.eq b{width:2px;background:var(--acc);animation:eq 1s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.4s}.eq b:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
.now h2{font-size:24px;line-height:1.3;margin:8px 0 2px;word-break:keep-all}
.now .meta{color:var(--mut);font-size:14px}
.waiting{color:var(--mut);text-align:center;padding:26px 0}

/* ===== 곡 상세 (지금 곡 카드와 팝업에서 같이 씀) ===== */
.react{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 10px 8px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid #2c2427}
.react>span{font-size:12px;color:var(--mut);flex:1;white-space:nowrap}
.react button{position:relative;width:38px;height:38px;border-radius:50%;background:#24262f;font-size:20px;line-height:38px;text-align:center;transition:transform .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.react button:active{transform:scale(.86)}
.react .fly{position:absolute;left:50%;top:0;pointer-events:none;font-size:20px;animation:fly .8s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,0) scale(1);opacity:1}to{transform:translate(-50%,-46px) scale(1.4);opacity:0}}
.myrate{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:var(--dim)}
.myrate .stars{display:flex;gap:1px}
.myrate .stars button{color:#34363f;padding:1px}
.myrate .stars button svg{width:15px;height:15px}
.myrate .stars button.on{color:var(--star)}
.myrate .rate-info{color:var(--dim)}
.cm-open{display:flex;align-items:center;gap:8px;width:100%;margin-top:16px;padding:12px 14px;border-radius:12px;background:#202129;color:#d6d7dc;font-size:14px;text-align:left}
.cm-open svg{width:16px;height:16px;color:var(--mut)}
.cm-open .go{margin-left:auto;font-size:12px;color:var(--mut)}
/* 돌아가는 CD */
.disc-wrap{position:relative;width:min(220px,62vw);aspect-ratio:1;margin:4px auto 18px}
.disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#2a2b33,#15161b);animation:spin 9s linear infinite;box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07)}
.disc img{width:100%;height:100%;object-fit:cover;display:block}
.disc-sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 20deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.22) 25deg,rgba(140,210,255,.14) 45deg,rgba(255,255,255,0) 80deg,rgba(255,255,255,0) 190deg,rgba(255,170,220,.14) 215deg,rgba(255,255,255,.2) 235deg,rgba(255,255,255,0) 270deg),
  repeating-radial-gradient(circle,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.disc-hub{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--panel) 0 27%,rgba(0,0,0,.35) 28% 31%,rgba(225,228,236,.55) 32% 62%,rgba(255,255,255,.12) 63% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.now .head{text-align:center}
.now.mystery .disc{background:conic-gradient(from 0deg,#2a2b33,#3a2a2c,#2a2b33,#24303a,#2a2b33);display:grid;place-items:center}
.now.mystery .mq{font-size:64px;font-weight:900;color:rgba(255,255,255,.7);animation:spin 9s linear infinite reverse}
.cv{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#202129;display:block}
.p-head{display:flex;gap:14px;align-items:center}
.p-head img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#202129;flex:none}
.sect{margin-top:18px}
.sect b{display:block;font-size:10px;letter-spacing:.16em;color:var(--mut);margin-bottom:4px}
.sect div{font-size:14px;white-space:pre-wrap;color:#d6d7dc}
.cm-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.cm-head b{font-size:13px}
.cm-head button{font-size:12px;color:var(--mut)}
.cm-list{margin:6px 0 0;padding:0;list-style:none}
.cm-list li{padding:9px 0;border-bottom:1px solid #202129}
.cm-list .who{font-size:12px;color:var(--mut)}
.cm-list .who b{color:#cfd0d6;font-weight:600;margin-right:6px}
.cm-list .txt{font-size:14px;white-space:pre-wrap;word-break:break-word}
.cm-empty{color:var(--mut);font-size:13px;padding:10px 0}
.cm-head{align-items:center!important}
.cm-write{font-size:12px;color:#fff!important;background:var(--acc);border-radius:99px;padding:5px 12px;font-weight:600}
.acts{display:flex;gap:14px;margin-top:3px;font-size:12px;color:var(--mut)}
.acts button{color:var(--mut);display:flex;align-items:center;gap:4px;font-size:12px}
.acts .like svg{width:13px;height:13px}
.acts .like.on{color:#ff6b81}
.acts .rt{color:#9aa6c8}
.cm-list .replies{list-style:none;margin:8px 0 2px;padding:0 0 0 12px;border-left:2px solid #2a2c35}
.cm-list .replies li{border:0;padding:5px 0}
.cm-foot button{width:100%;margin-top:8px;padding:9px;border-radius:10px;background:#202129;color:#c9cad1;font-size:13px}
#compose{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#compose[hidden]{display:none}
.c-title{font-size:16px;font-weight:700}
.c-quote{font-size:13px;color:var(--mut);border-left:2px solid #3a3d4a;padding:2px 0 2px 10px;margin:10px 0 0;white-space:pre-wrap;word-break:break-word;max-height:4.5em;overflow:hidden}
.cm-form{margin-top:12px;display:grid;gap:8px}
.cm-form input,.cm-form textarea{width:100%;background:#0c0d11;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
.cm-form textarea{min-height:60px;resize:vertical}
.cm-form .row{display:flex;gap:8px;align-items:center}
.cm-form .nick{font-size:12px;color:var(--mut);flex:1}
.cm-form .nick button{color:var(--acc);font-size:12px;margin-left:4px}
.send{background:var(--acc);color:#fff;font-weight:700;border-radius:10px;padding:10px 18px}
.send:disabled{opacity:.5}
.err{color:#ff8a8a;font-size:12px;min-height:16px;flex:1}

/* ===== 전체 진행 · 세션 목록 ===== */
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:30px 2px 8px}
.list-head b{font-size:12px;letter-spacing:.18em;color:var(--mut)}
.list-head span{font-size:12px;color:var(--mut)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .6s}
#program{max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px;overscroll-behavior:contain}
.session{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.session.cur{border-color:#4a2a22}
.sh{padding:16px 18px 12px}
.snum{font-size:10px;letter-spacing:.24em;color:var(--mut);font-weight:700;display:flex;justify-content:space-between}
.session.cur .snum span:first-child{color:var(--acc)}
.sh h3{margin:6px 0 0;font-size:18px;word-break:keep-all}
.sh p{margin:6px 0 0;font-size:13px;color:var(--mut);white-space:pre-wrap}
.session.locked .sh h3{color:#b9bac2}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol>li{border-top:1px solid #202129}
ol>li:first-child{border-top:0}
li.tr{display:grid;grid-template-columns:1fr auto;align-items:center}
.rowbtn{display:grid;grid-template-columns:22px 40px 1fr;gap:10px;align-items:center;padding:11px 0 11px 18px;text-align:left;min-width:0}
.n{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.tt{min-width:0}
.tt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icons{display:flex;align-items:center;gap:9px;padding:0 12px 0 8px}
.ico{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:24px}
.ico svg{width:14px;height:14px}
.ico.on{color:var(--star)}
.ico.has{color:var(--mut)}
.more{font-size:12px;color:#c9cad1;background:#24262f;border-radius:99px;padding:5px 10px;white-space:nowrap}
li.playing{background:#22191a}
li.playing .n{color:var(--acc)}
li.lock{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:13px 18px;color:var(--dim)}
.lockbar{height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--panel2) 0 8px,#181920 8px 12px);width:var(--w,60%)}
.lock svg{width:14px;height:14px}
li.lock.next .lockbar{background:repeating-linear-gradient(90deg,#2a2224 0 8px,#1d1a1c 8px 12px)}
.remain{font-size:12px;color:var(--mut);padding:10px 18px 14px;border-top:1px solid #202129;display:flex;align-items:center;gap:6px}
.remain svg{width:12px;height:12px}

/* ===== 팝업 ===== */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.panel{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.close{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:50%;background:#24262f;display:grid;place-items:center;color:var(--mut);margin:-6px -6px 0 0}
.close svg{width:14px;height:14px}
.p-sess{font-size:10px;letter-spacing:.2em;color:var(--acc);font-weight:700}
.p-title{font-size:22px;line-height:1.3;margin:6px 0 2px;word-break:keep-all}
.p-meta{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>THE LISTENING PARTY</h1><span class="conn" id="conn"><i></i>연결 중</span></header>
  <div id="stage"><section class="stage plain"><div class="waiting">곧 시작합니다</div></section></div>
  <div id="listHead"></div>
  <div id="program"></div>
</div>
<div id="sheet" hidden><div class="backdrop" data-close></div><div class="panel" id="panel"></div></div>
<div id="compose" hidden><div class="backdrop" data-cclose></div><div class="panel" id="cpanel"></div></div>
<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const I={
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  starO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  cm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
const lockW=(sid,i)=>{let h=0;for(const c of sid+i)h=(h*31+c.charCodeAt(0))>>>0;return 38+h%45;};
const fmtTime=at=>new Date(at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
const thumb=t=>t.img?`/img/${encodeURIComponent(t.id)}?v=${encodeURIComponent(t.img)}`:`https://i.ytimg.com/vi/${encodeURIComponent(t.id)}/hqdefault.jpg`;

/* ---------- 이 기기 (익명 식별 · 내 별점 · 닉네임) ---------- */
const store={get(k,d){try{return JSON.parse(localStorage.getItem('lp_'+k))??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('lp_'+k,JSON.stringify(v));}catch(e){}}};
let cid=store.get('cid',null);if(!cid){cid=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());store.set('cid',cid);}
let myRates=store.get('rates',{});
let nick=store.get('nick','');
let liked=store.get('liked',{});      // 내가 좋아요 누른 댓글
const moreOpen=new Set();             // 더보기 펼친 곡
const repliesOpen=new Set();          // 답글 펼친 댓글
const TOP_N=5;
const REACTS=[['heart','❤️'],['party','🎉'],['clap','👏'],['smile','😄'],['dance','💃']];

let S={program:{sessions:[]},now:null,unlocked:[],counts:{}};
const D={};            // 곡별 상세 (별점 요약 · 댓글)
let openId=null;       // 팝업에 열린 곡
const sessions=()=>S.program?.sessions||[];
const trackById=id=>S.unlocked.find(t=>t.id===id);

/* ---------- 곡 상세 블록 (ctx: 'now' = 지금 곡 카드, 'pop' = 팝업) ---------- */
// 내가 평가한 뒤에만 평균을 보여준다 (선입견 줄이기)
function rateText(id){
  const d=D[id];
  return myRates[id]&&d&&d.n?`평균 ${d.avg} · ${d.n}명`:'';
}
// 댓글: 좋아요 많은 순(같으면 최신 순) 상위 5개, 더보기로 전체. 답글은 접혀 있음
const topLevel=id=>(D[id]?.comments||[]).filter(c=>!c.parent).sort((a,b)=>(b.likes-a.likes)||(b.at-a.at));
function cmItem(id,c,isReply){
  const reps=isReply?[]:D[id].comments.filter(x=>x.parent===c.key).sort((a,b)=>a.at-b.at);
  const open=repliesOpen.has(c.key);
  return `<li><div class="who"><b>${esc(c.nick)}</b>${fmtTime(c.at)}</div><div class="txt">${esc(c.text)}</div>
    <div class="acts"><button class="like${liked[c.key]?' on':''}" data-like="${esc(c.key)}" aria-label="좋아요">${I.heart}<span>${c.likes||''}</span></button>
    ${isReply?'':`<button data-reply="${esc(c.key)}">답글 달기</button>`}
    ${reps.length?`<button class="rt" data-rtoggle="${esc(c.key)}">${open?'답글 접기':`답글 ${reps.length}개 보기`}</button>`:''}</div>
    ${open&&reps.length?`<ul class="replies">${reps.map(r=>cmItem(id,r,true)).join('')}</ul>`:''}</li>`;
}
function cmItems(id){
  if(!D[id])return '<li class="cm-empty">불러오는 중…</li>';
  const top=topLevel(id),shown=moreOpen.has(id)?top:top.slice(0,TOP_N);
  return top.length?shown.map(c=>cmItem(id,c,false)).join(''):'<li class="cm-empty">첫 댓글을 남겨주세요</li>';
}
function cmFoot(id){
  const n=topLevel(id).length;
  if(n<=TOP_N)return '';
  return `<button data-cmore="${esc(id)}">${moreOpen.has(id)?'접기':`더보기 (${n-TOP_N})`}</button>`;
}
function formHTML(){
  return `${nick?`<div class="row"><span class="nick">닉네임 <b>${esc(nick)}</b><button type="button" data-renick>바꾸기</button></span></div>`:`<input class="nick-in" maxlength="20" placeholder="닉네임" autocomplete="nickname">`}
    <textarea class="cm-in" maxlength="300" placeholder="이 곡 어땠나요?"></textarea>
    <div class="row"><span class="err"></span><button class="send">등록</button></div>`;
}
function detailBlock(t,ctx){
  const mine=myRates[t.id]||0;
  const info=[['곡 해설',t.notes],['관련곡',t.related]].filter(([,v])=>v);
  const count=D[t.id]?D[t.id].comments.length:(S.counts[t.id]||0);
  const rate=`<div class="myrate"><span>내 별점</span><span class="stars">${[1,2,3,4,5].map(i=>`<button data-rate="${i}" class="${i<=mine?'on':''}" aria-label="${i}점">${I.star}</button>`).join('')}</span><span class="rate-info">${rateText(t.id)}</span></div>`;
  // 댓글은 바로 보이고, 쓰기만 팝업
  const cm=`<div class="cm-head"><b>댓글 <span class="cm-count">${count}</span></b><button class="cm-write" data-compose="${esc(t.id)}">댓글 쓰기</button></div>
    <ul class="cm-list">${cmItems(t.id)}</ul><div class="cm-foot">${cmFoot(t.id)}</div>`;
  return `<div class="detail" data-ctx="${ctx}" data-id="${esc(t.id)}">
    ${info.map(([k,v])=>`<div class="sect"><b>${k}</b><div>${esc(v)}</div></div>`).join('')}
    ${rate}${cm}</div>`;
}
// 상세 데이터가 바뀌면 화면에 떠 있는 모든 상세 블록을 부분 갱신 (입력 중인 글은 그대로)
function refreshDetail(id){
  $$(`.detail[data-id="${CSS.escape(id)}"]`).forEach(el=>{
    const mine=myRates[id]||0,set=(sel,f)=>{const x=el.querySelector(sel);if(x)f(x);};
    el.querySelectorAll('.stars button').forEach(b=>b.classList.toggle('on',+b.dataset.rate<=mine));
    set('.rate-info',x=>x.textContent=rateText(id));
    set('.cm-count',x=>x.textContent=D[id]?D[id].comments.length:(S.counts[id]||0));
    set('.cm-list',x=>x.innerHTML=cmItems(id));
    set('.cm-foot',x=>x.innerHTML=cmFoot(id));
  });
}
async function loadDetail(id){
  try{
    const r=await fetch(`/api/track/${encodeURIComponent(id)}?cid=${encodeURIComponent(cid)}`);
    if(!r.ok)throw 0;
    const d=await r.json();D[id]=d;
    d.comments.forEach(c=>{if(c.liked)liked[c.key]=true;else delete liked[c.key];});store.set('liked',liked);
    if(d.mine&&myRates[id]!==d.mine){myRates[id]=d.mine;store.set('rates',myRates);renderList();}
  }catch(e){D[id]=D[id]||{avg:0,n:0,mine:0,comments:[]};}
  refreshDetail(id);
}

/* ---------- 지금 세션 + 지금 곡 ---------- */
let stageKey='';
function renderStage(){
  const t=S.now,ss=sessions(),s=t&&ss.find(x=>x.id===t.sid);
  const key=JSON.stringify([t,s,s?ss.indexOf(s):-1]);
  if(key===stageKey)return;       // 바뀐 게 없으면 다시 그리지 않음 (입력 중인 댓글 보호)
  stageKey=key;
  if(!t){$('#stage').innerHTML='<section class="stage plain"><div class="waiting">곧 시작합니다</div></section>';return;}
  const reactBar=`<div class="react"><span>노래에 반응해보세요!</span>${REACTS.map(([k,e])=>`<button data-react="${k}" aria-label="${k}">${e}</button>`).join('')}</div>`;
  if(t.mystery){
    // 곡은 흐르는 중, 정보는 아직 비공개
    $('#stage').innerHTML=`<section class="stage${s?'':' plain'}">
      ${s?`<div class="stage-head"><div class="stage-num">SESSION ${pad(ss.indexOf(s)+1)}</div><h2 class="stage-title">${esc(s.name)}</h2>${s.desc?`<p class="stage-desc">${esc(s.desc)}</p>`:''}</div>`:''}
      <div class="now mystery"><div class="disc-wrap"><div class="disc"><span class="mq">?</span></div><div class="disc-sheen"></div><div class="disc-hub"></div></div>
        <div class="head"><div class="label"><span class="eq"><b></b><b></b><b></b></span>NOW PLAYING</div>
        <h2>지금 흐르는 이 곡은…</h2><div class="meta">곧 공개됩니다. 귀 기울여 맞혀보세요!</div></div></div>
      ${reactBar}</section>`;
    return;
  }
  const meta=[t.artist,t.album,t.year].filter(Boolean).map(esc).join(' · ');
  $('#stage').innerHTML=`<section class="stage${s?'':' plain'}">
    ${s?`<div class="stage-head"><div class="stage-num">SESSION ${pad(ss.indexOf(s)+1)}</div><h2 class="stage-title">${esc(s.name)}</h2>${s.desc?`<p class="stage-desc">${esc(s.desc)}</p>`:''}</div>`:''}
    <div class="now">
      <div class="disc-wrap"><div class="disc"><img src="${thumb(t)}" alt="" onerror="this.style.visibility='hidden'"></div><div class="disc-sheen"></div><div class="disc-hub"></div></div>
      <div class="head"><div class="label"><span class="eq"><b></b><b></b><b></b></span>NOW PLAYING</div>
      <h2>${esc(t.title)}</h2><div class="meta">${meta}</div></div>
      ${detailBlock(t,'now')}</div>
    ${reactBar}</section>`;
  if(!D[t.id])loadDetail(t.id);
}

/* ---------- 세션별 목록 ---------- */
function rowIcons(t){
  const r=myRates[t.id]||0,c=S.counts[t.id]||0;
  return `<span class="icons">
    <span class="ico${r?' on':''}" title="내 별점">${r?I.star:I.starO}${r||''}</span>
    <span class="ico${c?' has':''}" title="댓글">${I.cm}${c}</span>
    <button class="more" data-open="${esc(t.id)}">자세히보기</button></span>`;
}
function trackRow(t,n){
  return `<li class="tr${t.id===S.now?.id?' playing':''}" id="t-${esc(t.id)}">
    <button class="rowbtn" data-open="${esc(t.id)}"><span class="n">${n}</span><img class="cv" src="${thumb(t)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="tt"><span>${esc(t.title)}</span><small>${esc(t.artist)}</small></span></button>
    ${rowIcons(t)}</li>`;
}
let firstScroll=true,lastNow=null;
function renderList(){
  const ss=sessions(),nowT=S.now,curSid=nowT?.sid;
  const bySid={};S.unlocked.forEach(t=>(bySid[t.sid]||=[]).push(t));
  const total=ss.reduce((a,x)=>a+x.count,0),opened=S.unlocked.length;
  $('#listHead').innerHTML=total?`<div class="list-head"><b>PLAYLIST</b><span>${Math.min(opened,total)} / ${total}곡 공개 · ${Math.max(0,total-opened)}곡 남음</span></div><div class="bar"><i style="width:${Math.min(100,opened/total*100)}%"></i></div>`
    :(opened?'<div class="list-head"><b>PLAYLIST</b></div>':'');
  const keep=$('#program').scrollTop;
  let html='',g=0;
  ss.forEach((x,si)=>{
    const open=bySid[x.id]||[],locked=Math.max(0,x.count-open.length);
    const cls=x.id===curSid?'cur':!open.length?'locked':'';
    let rows=open.map(t=>trackRow(t,pad(++g))).join('');
    for(let i=0;i<locked;i++)rows+=`<li class="lock${i===0&&x.id===curSid?' next':''}"><span class="n">${pad(++g)}</span><span class="lockbar" style="--w:${lockW(x.id,i)}%"></span>${I.lock}</li>`;
    html+=`<section class="session ${cls}">
      <div class="sh"><div class="snum"><span>SESSION ${pad(si+1)}</span><span>${open.length} / ${x.count}</span></div>
      <h3>${esc(x.name)}</h3>${x.desc?`<p>${esc(x.desc)}</p>`:''}</div>
      ${rows?`<ol>${rows}</ol>`:''}
      ${locked?`<div class="remain">${I.lock}<span>${locked}곡이 잠겨 있어요</span></div>`:''}</section>`;
  });
  const known=new Set(ss.map(x=>x.id)),extra=S.unlocked.filter(t=>!known.has(t.sid));
  if(extra.length)html+=`<section class="session"><div class="sh"><h3>${ss.length?'그 밖의 곡':'지금까지 들은 곡'}</h3></div><ol>${extra.map(t=>trackRow(t,'·')).join('')}</ol></section>`;
  $('#program').innerHTML=html;
  $('#program').scrollTop=keep;

  // 처음 들어왔을 때, 곡이 바뀔 때: 목록 안에서 지금 곡이 가운데 오도록 (페이지는 그대로)
  const id=nowT?.id||'';
  if(id&&(firstScroll||id!==lastNow)){
    const box=$('#program'),el=document.getElementById('t-'+id);
    if(el){
      const top=el.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop-box.clientHeight/2+el.offsetHeight/2;
      box.scrollTo({top:Math.max(0,top),behavior:firstScroll?'auto':'smooth'});
      firstScroll=false;
    }
  }
  lastNow=id;
}
function render(){renderStage();renderList();}

/* ---------- 팝업 ---------- */
function openSheet(id){
  const t=trackById(id);if(!t)return;
  if(!openId)history.pushState({sheet:1},'');
  openId=id;
  const ss=sessions(),s=ss.find(x=>x.id===t.sid);
  const meta=[t.artist,t.album,t.year].filter(Boolean).map(esc).join(' · ');
  $('#panel').innerHTML=`<button class="close" data-close aria-label="닫기">${I.x}</button>
    ${s?`<div class="p-sess">SESSION ${pad(ss.indexOf(s)+1)} · ${esc(s.name)}</div>`:''}
    <div class="p-head"><img src="${thumb(t)}" alt="" onerror="this.style.visibility='hidden'"><div><div class="p-title">${esc(t.title)}</div><div class="p-meta">${meta}</div></div></div>${detailBlock(t,'pop')}`;
  $('#panel').scrollTop=0;$('#sheet').hidden=false;document.body.classList.add('lock');
  loadDetail(id);
}
function closeSheet(fromPop){
  if(!openId)return;
  openId=null;$('#sheet').hidden=true;$('#panel').innerHTML='';document.body.classList.remove('lock');
  if(!fromPop)history.back();
}
let composing=null; // {id, parent}
function openCompose(id,parent){
  const t=trackById(id);if(!t)return;
  composing={id,parent:parent||''};
  const p=parent&&D[id]?.comments.find(c=>c.key===parent);
  $('#cpanel').innerHTML=`<button class="close" data-cclose aria-label="닫기">${I.x}</button>
    <div class="c-title">${p?'답글 쓰기':'댓글 쓰기'}</div><div class="p-meta">${esc(t.title)} · ${esc(t.artist)}</div>
    ${p?`<div class="c-quote"><b>${esc(p.nick)}</b> ${esc(p.text)}</div>`:''}
    <form class="cm-form">${formHTML()}</form>`;
  history.pushState({compose:1},'');
  $('#compose').hidden=false;document.body.classList.add('lock');
  setTimeout(()=>($('#cpanel .nick-in')||$('#cpanel .cm-in'))?.focus(),50);
}
function closeCompose(fromPop){
  if(!composing)return;
  composing=null;$('#compose').hidden=true;$('#cpanel').innerHTML='';
  if(!openId)document.body.classList.remove('lock');
  if(!fromPop)history.back();
}
window.addEventListener('popstate',()=>{if(composing)closeCompose(true);else closeSheet(true);});

/* ---------- 클릭 · 별점 · 댓글 ---------- */
document.addEventListener('click',async e=>{
  const rb2=e.target.closest('[data-react]');
  if(rb2){
    const fly=document.createElement('span');fly.className='fly';fly.textContent=rb2.textContent;rb2.appendChild(fly);setTimeout(()=>fly.remove(),800);
    if(navigator.vibrate)try{navigator.vibrate(8);}catch(err){}
    fetch('/api/react',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cid,e:rb2.dataset.react})}).catch(()=>{});
    return;
  }
  const o=e.target.closest('[data-open]');if(o){openSheet(o.dataset.open);return;}
  if(e.target.closest('[data-close]')){closeSheet();return;}
  if(e.target.closest('[data-cclose]')){closeCompose();return;}
  const cw=e.target.closest('[data-compose]');if(cw){openCompose(cw.dataset.compose);return;}
  const rp=e.target.closest('[data-reply]');if(rp){openCompose(rp.closest('.detail').dataset.id,rp.dataset.reply);return;}
  const rt=e.target.closest('[data-rtoggle]');
  if(rt){const k=rt.dataset.rtoggle;repliesOpen.has(k)?repliesOpen.delete(k):repliesOpen.add(k);refreshDetail(rt.closest('.detail').dataset.id);return;}
  const mo=e.target.closest('[data-cmore]');
  if(mo){const id=mo.dataset.cmore;moreOpen.has(id)?moreOpen.delete(id):moreOpen.add(id);refreshDetail(id);return;}
  const lk=e.target.closest('[data-like]');
  if(lk){
    const id=lk.closest('.detail').dataset.id,key=lk.dataset.like,c=D[id]?.comments.find(x=>x.key===key);if(!c)return;
    const on=!liked[key];
    if(on)liked[key]=true;else delete liked[key];store.set('liked',liked);
    c.likes=Math.max(0,(c.likes||0)+(on?1:-1));refreshDetail(id);
    try{const r=await fetch('/api/like',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,key,cid})});
      if(r.ok){const j=await r.json();c.likes=j.likes;if(j.liked)liked[key]=true;else delete liked[key];store.set('liked',liked);refreshDetail(id);}}catch(err){}
    return;
  }
  const rb=e.target.closest('[data-rate]');
  if(rb){
    const id=rb.closest('.detail').dataset.id,score=+rb.dataset.rate;
    myRates[id]=score;store.set('rates',myRates);refreshDetail(id);renderList();
    try{const r=await fetch('/api/rate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,cid,score})});
      if(r.ok){const d=await r.json();D[id]={...(D[id]||{comments:[]}),...d};refreshDetail(id);}}catch(err){}
    return;
  }
  if(e.target.closest('[data-renick]')){
    nick='';store.set('nick','');
    $$('.cm-form').forEach(f=>{const txt=f.querySelector('.cm-in').value;f.innerHTML=formHTML();f.querySelector('.cm-in').value=txt;});
    e.target.closest('.detail')?.querySelector('.nick-in')?.focus();
  }
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('.cm-form');if(!f)return;
  e.preventDefault();
  if(!composing)return;
  const {id,parent}=composing,inp=f.querySelector('.cm-in'),err=f.querySelector('.err'),btn=f.querySelector('.send');
  const text=inp.value.trim(),nn=nick||(f.querySelector('.nick-in')?.value.trim()||'');
  if(!nn){err.textContent='닉네임을 먼저 정해주세요';f.querySelector('.nick-in')?.focus();return;}
  if(!text){err.textContent='내용을 입력해주세요';return;}
  btn.disabled=true;err.textContent='';
  try{
    const r=await fetch('/api/comment',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,cid,nick:nn,text,parent})});
    if(!r.ok)throw new Error(await r.text());
    const {comment}=await r.json();
    if(D[id]&&!D[id].comments.some(c=>c.key===comment.key))D[id].comments.push(comment);
    if(parent)repliesOpen.add(parent);
    if(!nick){nick=nn;store.set('nick',nick);}
    refreshDetail(id);renderList();closeCompose();return;
  }catch(ex){err.textContent=ex.message||'등록하지 못했어요';}
  btn.disabled=false;
});

/* ---------- 실시간 ---------- */
function onMessage(m){
  if(m.type==='state'){
    const prevIds=new Set(S.unlocked.map(t=>t.id));
    S={...S,...m,counts:m.counts||{}};
    // 공개 초기화 등으로 사라진 곡의 상세 캐시는 버린다
    if(S.unlocked.length<prevIds.size)Object.keys(D).forEach(id=>{if(!trackById(id))delete D[id];});
    render();
    if(openId&&!trackById(openId))closeSheet();
  }
  if(m.type==='like'){
    const c=D[m.id]?.comments.find(x=>x.key===m.key);
    if(c){c.likes=m.likes;refreshDetail(m.id);}
  }
  if(m.type==='comment'||m.type==='uncomment'){
    S.counts[m.id]=m.count;
    const d=D[m.id];
    if(d){
      if(m.type==='comment'&&!d.comments.some(c=>c.key===m.comment.key))d.comments.push(m.comment);
      if(m.type==='uncomment')d.comments=d.comments.filter(c=>c.key!==m.key&&c.parent!==m.key);
    }
    refreshDetail(m.id);renderList();
  }
}
let delay=1000;
function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/live');
  let ping;
  const setConn=(on,txt)=>{$('#conn').className='conn'+(on?' on':'');$('#conn').lastChild.textContent=txt;};
  ws.onopen=()=>{delay=1000;setConn(true,'연결됨');ping=setInterval(()=>ws.readyState===1&&ws.send('ping'),25000);};
  ws.onmessage=e=>{if(e.data==='pong')return;onMessage(JSON.parse(e.data));};
  ws.onclose=()=>{clearInterval(ping);setConn(false,'재연결 중');setTimeout(connect,delay);delay=Math.min(delay*2,15000);};
}
connect();
</script>
